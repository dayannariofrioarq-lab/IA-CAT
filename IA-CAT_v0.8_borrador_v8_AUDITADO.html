// =====================================================================
function renderAlertas(){
  const col = $('colCentro');
  const items = [];
  S.predios.forEach(p=>{
    const e = evaluar(p);
    if(e.zonas.length) items.push({n:1, nivel:'ALTA', codigo:p.codigo, texto:`Dentro de una zona de amenaza: ${esc(e.zonas[0].nombre)}`});
    if(e.ult && e.ult.valores.estado_conservacion==='Malo') items.push({n:1, nivel:'ALTA', codigo:p.codigo, texto:`Última inspección con estado malo (${e.ult.fecha}).`});
    if(e.pend.length) items.push({n:2, nivel:'MEDIA', codigo:p.codigo, texto:`${e.pend.length} actualización(es) pendiente(s).`});
    if(e.brechas.length) items.push({n:3, nivel:'MEDIA', codigo:p.codigo, texto:`Información incompleta: ${esc(e.brechas[0])}`});
    if(!vigente(p.codigo)) items.push({n:4, nivel:'MEDIA', codigo:p.codigo, texto:`Sin inspección en los últimos ${S.reglas.diasInspeccion} días.`});
    if(e.ult && e.ult.alerta_ubicacion) items.push({n:2, nivel:'MEDIA', codigo:p.codigo, texto:`La última visita quedó a ${e.ult.dist_m} m del predio.`});
  });
  items.sort((a,b)=>a.n-b.n);
  const r = S.reglas;
  col.innerHTML = `
    <div class="cab-card"><div><h1>Alertas y reglas</h1><div class="muted">Las alertas salen de las reglas de abajo. Cambia un umbral y el efecto es inmediato.</div></div></div>
    <div class="card">
      <h3 style="margin-top:0">Reglas</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
        <label class="campo">Días máximos sin inspección<input type="number" id="r-dias" min="30" max="3650" value="${r.diasInspeccion}" ${puede('reglas')?'':'disabled'}></label>
        <label class="campo">Diferencia de área considerada brecha (%)<input type="number" id="r-area" min="0" max="100" value="${Math.round(r.umbralArea*100)}" ${puede('reglas')?'':'disabled'}></label>
        <label class="campo">Distancia máxima visita–predio (m)<input type="number" id="r-gps" min="5" max="5000" value="${r.umbralGPS}" ${puede('reglas')?'':'disabled'}></label>
        <label class="campo">Antigüedad máxima de una fuente (días)<input type="number" id="r-vig" min="30" max="3650" value="${S.reglas.vigenciaDias||365}" ${puede('reglas')?'':'disabled'}></label>
        <label class="campo">Plazo por defecto de visita (días)<input type="number" id="r-plazo" min="1" max="365" value="${r.plazoDias}" ${puede('reglas')?'':'disabled'}></label>
      </div>
      <label class="campo"><input type="checkbox" id="r-malo" ${r.maloEsAlta?'checked':''} ${puede('reglas')?'':'disabled'}> El estado de conservación malo cuenta como prioridad alta</label>
      ${puede('reglas') ? '<button class="btn" id="r-guardar">Guardar reglas</button>' : '<p class="muted">Solo el supervisor puede cambiar las reglas.</p>'}
    </div>
    <h3>Alertas activas (${items.length})</h3>
    ${items.map(a=>`<div class="card ${a.nivel==='ALTA'?'alta':'media'}" data-id="${esc(a.codigo)}" style="cursor:pointer">
      <div class="cab-card"><b>${esc(a.codigo)}</b><span class="tag ${a.nivel}">${a.nivel}</span></div>
      <div class="muted" style="margin-top:4px">${a.texto}</div></div>`).join('') || '<div class="empty"><b>Sin alertas</b>Con las reglas actuales no hay nada que atender.</div>'}`;
  const g = $('r-guardar');
  if(g) g.onclick = ()=>{
    const d=parseInt($('r-dias').value,10), a=parseFloat($('r-area').value), gps=parseFloat($('r-gps').value), pl=parseInt($('r-plazo').value,10);
    if(!(d>=30) || isNaN(a) || !(gps>=5) || !(pl>=1)){ show('Revisa los valores de las reglas'); return; }
    S.reglas = {diasInspeccion:d, umbralArea:a/100, maloEsAlta:$('r-malo').checked, umbralGPS:gps, plazoDias:pl, vigenciaDias: parseInt($('r-vig').value,10) || 365};
    registrar('cambió reglas', '', `días ${d}, área ${a}%, GPS ${gps} m, plazo ${pl}`);
    guardar(); render(); show('Reglas guardadas');
  };
  col.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{ sel=el.dataset.id; vista='bandeja'; render(); });
}

function paginaPredio(p){
  const e = evaluar(p);
  const filas = CAMPOS.map(c=>{ const x=valorVigente(p,c); return [ETIQ[c], v(x.valor), x.origen, esc(x.ref)]; });
  filas.push(['Área del archivo', m((p.fuente||{}).area_fuente), 'FUENTE', 'Catastro']);
  filas.push(['Área de la geometría', m(e.areaCalc), 'CALCULADO', 'Cálculo con geometría']);
  const insp = (S.inspecciones[p.codigo]||[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const hist = S.actualizaciones.filter(a=>a.codigo===p.codigo).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  const ultima = insp[0];
  const evid = (S.evidencia||{})[p.codigo] || [];
  const fotosUlt = OPC.fotos ? (evid.length ? evid.map(x=>({id:x.id, categoria:x.pie})) : (ultima ? (ultima.fotos||[]) : [])) : [];
  return `
  <section class="pagina">
    <div class="cab-inf"><span>${esc(S.institucion)} · IA-CAT · Informe territorial preliminar</span><span>Emitido el ${new Date().toLocaleDateString('es-EC')}</span></div>
    <h1>${esc(p.codigo)}</h1>
    <div class="muted">${v(valorVigente(p,'direccion').valor)}</div>
    <div class="aviso-doc">${haySimulacion() ? 'DATOS DE PRUEBA: no son oficiales.' : 'Datos cargados desde '+esc(S.fuenteDatos)+'. Verificar procedencia antes de usar.'}</div>
    <h3>1. Prioridad de revisión</h3>
    <p><b>Nivel: ${e.prioridad}.</b> Orienta la inspección. La define y aprueba el técnico responsable; no es un diagnóstico de riesgo.</p>
    ${lista(e.motivos.map(esc))}
    <h3>2. Datos vigentes y su origen</h3>
    ${tabla(['Campo','Valor','Origen','Referencia'], filas)}
    <h3>3. Brechas y validación en campo</h3>
    <p><b>Brechas de información</b></p>${lista(e.brechas)}
    <p><b>Requiere validación en campo</b></p>${lista(e.validar)}
    ${estadoPredio(ultima, p)}
    ${OPC.inspecciones ? `<h3>Inspecciones registradas [VALIDADO]</h3>
      ${insp.length ? tabla(['Fecha','Técnico','Estado','Discrepancias','Ubicación / observaciones'], insp.map(r=>[r.fecha, esc(r.tecnico), esc(r.valores.estado_conservacion||'—'), esc(r.discrepancias||'—'), `${r.dist_m!=null?`A ${r.dist_m} m. `:''}${esc(r.observaciones||'—')}`])) : '<p class="muted">Ninguna registrada.</p>'}` : ''}
    ${OPC.fotos && fotosUlt.length ? `<h3>${evid.length ? 'Evidencia fotográfica seleccionada' : 'Fotografías de la última inspección ('+(ultima?ultima.fecha:'')+')'}</h3>

function estadoPredio(ins, p){
  if(!ins) return `<h3>4. Estado actual y daños observados</h3><p class="muted">Sin inspección registrada: el estado actual del predio no se conoce todavía.</p>`;
  const danos = ins.danos || [];
  let html = `<h3>4. Estado actual y daños observados</h3>
    <p>Última inspección: <b>${ins.fecha}</b>. Estado de conservación registrado: <b>${esc(ins.valores.estado_conservacion||'—')}</b>${danos.length ? `. Daños registrados: <b>${danos.length}</b>, severidad máxima <b>${sevMaxima(danos)}</b>.` : '. Sin daños registrados.'}</p>`;
  if(danos.length){
    html += tabla(['Tipo','Ubicación','Severidad','Extensión','Descripción'],
      danos.map(d=>[esc(d.tipo), esc(d.ubicacion||'—'), `<span class="tag ${SEV_TAG[d.severidad]||''}">${esc(d.severidad)}</span>`, esc(d.extension||'—'), esc(d.descripcion||'—')]));
    const fotosDanos = danos.flatMap(d=>d.fotos.map(id=>(ins.fotos||[]).find(f=>f.id===id)).filter(Boolean));
    if(fotosDanos.length) html += `<div class="fotos-inf">${fotosDanos.map(f=>`<div><img data-foto="${esc(f.id)}" alt="${esc(f.nombre)}" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="><span>${esc(f.nombre)}</span></div>`).join('')}</div>`;
  }
  if(ins.analisis_ia && ins.analisis_ia.validado)
    html += `<p><span class="badge IA">Análisis con IA · validado por el técnico</span></p><div class="msg">${esc(ins.analisis_ia.texto)}</div>`;
  return html;
}

async function completarFotosInforme(){

          opts:{attribution:'© OpenStreetMap contributors', maxZoom:19}}
};

const BD_VISIBLE = {predios:true, manzanas:true};
let BD_MAPA = null, BD_GRUPOS = {}, BD_PEDIDO = 0;
let BD_FONDO_CAPA = null, BD_FONDO_ACTUAL = 'ninguno';
let BD_VISTA = {predios:[], manzanas:[]}; // geometrías de la última respuesta, para saber qué predio se pulsó
let BD_SEL = null;     // predio seleccionado: {id, codigo, geometry}
let BD_RESALTE = null; // capa naranja del predio seleccionado (no interactiva)

const BD_SIM_CLAVE = 'iacat-simulacion-inspecciones'; // SOLO datos ficticios, solo en este navegador
function bdSimLeer(){
  try{ return JSON.parse(localStorage.getItem(BD_SIM_CLAVE) || '[]'); }catch(e){ return []; }
}
function bdSimGuardar(lista){
  try{ localStorage.setItem(BD_SIM_CLAVE, JSON.stringify(lista)); return true; }catch(e){ return false; }
}

// Llamada RPC con la extensión visible (longitud/latitud, EPSG:4326)
async function bdLlamar(fn, bounds){
  const r = await fetch(`${bdBase()}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: bdCabeceras(),
    body: JSON.stringify({
      xmin: bounds.getWest(), ymin: bounds.getSouth(),
      xmax: bounds.getEast(), ymax: bounds.getNorth(),
      limite: BD_LIMITE
    })
  });
  if(!r.ok){
    let cuerpo = '';
    try{ cuerpo = await r.text(); }catch(e){}
    throw new Error(`HTTP ${r.status} · ${cuerpo.slice(0,160) || 'sin detalle'}`);
  }
  const datos = await r.json();
  if(!datos || datos.type !== 'FeatureCollection' || !Array.isArray(datos.features)){
    throw new Error('respuesta no válida de ' + fn);
  }
  return datos;
}

// ---- Geometría: ¿el punto pulsado cae dentro de un predio? ----
function bdEnAnillo(lng, lat, anillo){
  let dentro = false;
  for(let i = 0, j = anillo.length - 1; i < anillo.length; j = i++){
    const xi = anillo[i][0], yi = anillo[i][1], xj = anillo[j][0], yj = anillo[j][1];
    if((yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / ((yj - yi) || 1e-12) + xi) dentro = !dentro;
  }
  return dentro;
}
function bdContiene(geom, lng, lat){
  if(!geom) return false;
  const poligonos = geom.type === 'Polygon' ? [geom.coordinates]
                  : geom.type === 'MultiPolygon' ? geom.coordinates : [];
  return poligonos.some(anillos => {
    // Regla par/impar: los agujeros (anillos interiores) se restan automáticamente
    let n = 0;
    anillos.forEach(a => { if(bdEnAnillo(lng, lat, a)) n++; });
    return n % 2 === 1;
  });
}
function bdBuscarPredio(lng, lat){
  return BD_VISTA.predios.find(f => bdContiene(f.geometry, lng, lat)) || null;
}

// ---- Selección y resaltado ----
function bdSeleccionarFeature(f){
  const pr = f.properties || {};
  BD_SEL = {id: pr.id, codigo: pr.codigo || null, geometry: f.geometry};
  bdDibujarResalte();
  bdPintarFicha();
}
function bdLimpiarSeleccion(){
  BD_SEL = null;
  bdDibujarResalte();
  bdPintarFicha();
}
function bdDibujarResalte(){
  if(!BD_MAPA) return;
  if(BD_RESALTE){ BD_MAPA.removeLayer(BD_RESALTE); BD_RESALTE = null; }
  if(!BD_SEL || !BD_SEL.geometry) return;
  BD_RESALTE = L.geoJSON({type:'Feature', properties:{}, geometry: BD_SEL.geometry}, {
    interactive: false,
    style: {color:'#d9961a', weight:3, fillColor:'#f5a623', fillOpacity:.5}
  }).addTo(BD_MAPA);
  BD_RESALTE.bringToFront();
}

function bdPintarFicha(){
  const cont = $('bd-sel');
  if(!cont) return;
  if(!BD_SEL){ cont.innerHTML = '<span class="muted">Toca un predio para ver su ficha.</span>'; return; }
  const registros = bdSimLeer().filter(x => x.predio_id === BD_SEL.id);
  cont.innerHTML = `
    <div style="font-weight:700;color:var(--navy);margin-bottom:4px">Predio seleccionado</div>
    <div class="lab" style="margin:6px 0 2px">Datos catastrales (Supabase, solo lectura)</div>
    <div class="row" style="padding:4px 0"><span class="k">ID interno</span><span>${esc(String(BD_SEL.id))}</span></div>
    <div class="row" style="padding:4px 0"><span class="k">Código catastral</span><span>${BD_SEL.codigo ? esc(BD_SEL.codigo) : 'sin código'}</span></div>
    <div class="muted" style="margin:4px 0">El código no es único: las referencias usan el ID interno.
      Uso, dirección, manzana y lote requieren una consulta de detalle pendiente.</div>
    <div class="lab" style="margin:8px 0 2px">Registros de inspección</div>
    <div class="muted">${registros.length
      ? `${registros.length} registro(s) guardado(s) solo en este navegador.`
      : 'Sin registros de inspección disponibles para este predio.'}</div>
    <button class="btn mini sec" id="bd-nueva-sim" style="margin-top:6px">Nueva inspección</button>
    <div id="bd-form-sim"></div>`;
  $('bd-nueva-sim').onclick = bdAbrirFormularioSim;
}

function bdAbrirFormularioSim(){
  $('bd-form-sim').innerHTML = `
    <div class="muted" style="margin:8px 0 4px">Este registro se guarda solo en este navegador y todavía no se envía a Supabase.</div>
    <label class="campo" style="margin:4px 0">Técnico<input type="text" id="bd-sim-tec" placeholder="Nombre del técnico"></label>
    <label class="campo" style="margin:4px 0">Estado de conservación
      <select id="bd-sim-est"><option>Bueno</option><option>Regular</option><option>Malo</option></select></label>
    <label class="campo" style="margin:4px 0">Observación<textarea id="bd-sim-obs" placeholder="Describe lo observado"></textarea></label>
    <button class="btn mini ok" id="bd-sim-guardar">Guardar simulación</button>
    <button class="btn mini sec" id="bd-sim-cancelar">Cancelar</button>`;
  $('bd-sim-guardar').onclick = bdGuardarSim;
  $('bd-sim-cancelar').onclick = ()=>{ $('bd-form-sim').innerHTML = ''; };
}

function bdGuardarSim(){
  if(!BD_SEL) return;
  const lista = bdSimLeer();
  lista.push({
    predio_id: BD_SEL.id,
    codigo: BD_SEL.codigo,
    fecha: new Date().toISOString().slice(0,10),
    tecnico: $('bd-sim-tec').value.trim(),
    estado: $('bd-sim-est').value,
    observacion: $('bd-sim-obs').value.trim()
  });
  if(!lista[lista.length-1].tecnico){ lista.pop(); if($('bd-est')) $('bd-est').textContent = 'Indica el nombre del técnico.'; return; }
  const ok = bdSimGuardar(lista);
  $('bd-form-sim').innerHTML = '';
  bdPintarFicha();
  if($('bd-est')) $('bd-est').textContent = ok
    ? 'Registro guardado en este navegador (no en Supabase).'
    : 'No se pudo guardar: el navegador bloquea el almacenamiento local.';
}

// ---- Fondo de mapa opcional ----
function bdPonerFondo(clave){
  BD_FONDO_ACTUAL = clave;
  if(!BD_MAPA) return;
  if(BD_FONDO_CAPA){ BD_MAPA.removeLayer(BD_FONDO_CAPA); BD_FONDO_CAPA = null; }
  const f = BD_FONDOS[clave];
  if(!f) return;
  BD_FONDO_CAPA = L.tileLayer(f.url, Object.assign({
    errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
  }, f.opts)).addTo(BD_MAPA);
  BD_FONDO_CAPA.on('tileerror', ev=>console.warn('Mosaico con error (' + clave + '):', ev && ev.tile ? ev.tile.src : ''));
}

// ---- Mapa ----
function renderMapaBD(){
  const col = $('colCentro');
  if(BD_MAPA){ try{ BD_MAPA.remove(); }catch(e){} BD_MAPA = null; }
  BD_GRUPOS = {}; BD_FONDO_CAPA = null; BD_RESALTE = null;
  col.innerHTML = `<div id="bdmap" style="height:100%;width:100%;background:#eef3f6"></div>
    <div class="mapa-leg" style="max-width:300px">
      <div id="bd-est">Cargando…</div>
      <div class="leyenda" id="bd-capas">${Object.entries(BD_CAPAS).map(([k,c])=>
        `<label><input type="checkbox" data-bdcapa="${k}" ${BD_VISIBLE[k]?'checked':''}> ${c.nombre}</label>`).join(' ')}</div>
      <label class="campo" style="margin:6px 0 2px">Fondo de mapa
        <select id="bd-fondo">
          <option value="ninguno" ${BD_FONDO_ACTUAL==='ninguno'?'selected':''}>Sin fondo</option>
          <option value="carto" ${BD_FONDO_ACTUAL==='carto'?'selected':''}>CARTO</option>
          <option value="osm" ${BD_FONDO_ACTUAL==='osm'?'selected':''}>OpenStreetMap</option>
        </select></label>
      <div id="bd-sel" class="muted" style="margin-top:6px"></div>
      <button class="btn mini sec" id="bd-probar" style="margin-top:6px">Probar conexión</button>
    </div>`;
  if(!bdConfigurada()){
    $('bd-est').textContent = 'Falta configurar la conexión a Supabase (URL y clave publicable).';
    return;
  }
  BD_MAPA = L.map('bdmap').setView(BD_CENTRO, BD_ZOOM_MIN);
  bdPonerFondo(BD_FONDO_ACTUAL);
  Object.keys(BD_CAPAS).forEach(k=>{
    BD_GRUPOS[k] = L.layerGroup();
    if(BD_VISIBLE[k]) BD_GRUPOS[k].addTo(BD_MAPA);
  });
  bdDibujarResalte();

  // Un solo mecanismo de selección: el clic del mapa, resuelto por geometría
  BD_MAPA.on('click', e=>{
    if(!BD_VISIBLE.predios){ return; }
    const f = bdBuscarPredio(e.latlng.lng, e.latlng.lat);
    if(f){
      bdSeleccionarFeature(f);
      const pr = f.properties || {};
      L.popup().setLatLng(e.latlng).setContent(
        `<b>Predio seleccionado</b><br>ID: ${esc(String(pr.id))}<br>Código: ${pr.codigo ? esc(pr.codigo) : 'sin código'}`
      ).openOn(BD_MAPA);
    } else {
      bdLimpiarSeleccion();
    }
  });

  col.querySelectorAll('[data-bdcapa]').forEach(cb=>cb.onchange=()=>{
    const k = cb.dataset.bdcapa;
    BD_VISIBLE[k] = cb.checked;
    if(!BD_MAPA) return;
    if(cb.checked) BD_GRUPOS[k].addTo(BD_MAPA); else BD_MAPA.removeLayer(BD_GRUPOS[k]);
    if(!cb.checked) BD_VISTA[k] = [];
    bdActualizar();
  });
  $('bd-fondo').onchange = e=>bdPonerFondo(e.target.value);
  $('bd-probar').onclick = bdProbar;
  BD_MAPA.on('moveend', bdActualizar);
  bdPintarFicha();
  setTimeout(()=>{ if(BD_MAPA) BD_MAPA.invalidateSize(); }, 0);
  bdActualizar();
}

// Prueba real de las dos funciones RPC con una zona pequeña
const BD_ZONA_PRUEBA = {xmin:-79.8900, ymin:-2.2000, xmax:-79.8850, ymax:-2.1950, limite:5};
async function bdProbar(){
  const est = $('bd-est');
  if(!est) return;
  est.textContent = 'Probando funciones…';
  const lineas = [];
  for(const k of Object.keys(BD_CAPAS)){
    try{
      const r = await fetch(`${bdBase()}/rest/v1/rpc/${BD_CAPAS[k].fn}`, {
        method:'POST', headers: bdCabeceras(), body: JSON.stringify(BD_ZONA_PRUEBA)
      });
      const texto = await r.text();
      if(!r.ok){ lineas.push(`${BD_CAPAS[k].nombre}: HTTP ${r.status} · ${texto.slice(0,200)}`); continue; }
      const datos = JSON.parse(texto);
      const n = Array.isArray(datos.features) ? datos.features.length : 'formato no esperado';
      lineas.push(`${BD_CAPAS[k].nombre}: HTTP ${r.status} · ${n} elemento(s) de prueba`);
    }catch(e){ lineas.push(`${BD_CAPAS[k].nombre}: sin respuesta · ${e.message}`); }
  }
  est.textContent = lineas.join(' | ');
}

async function bdActualizar(){
  if(!BD_MAPA || !$('bd-est')) return;
  const est = $('bd-est');
  if(BD_MAPA.getZoom() < BD_ZOOM_MIN){
    Object.values(BD_GRUPOS).forEach(g=>g.clearLayers());
    BD_VISTA = {predios:[], manzanas:[]};
    est.textContent = `Acerca el mapa (zoom ${BD_ZOOM_MIN} o más) para cargar elementos.`;
    return;
  }
  const pedido = ++BD_PEDIDO;
  const bounds = BD_MAPA.getBounds();
  const todas = Object.keys(BD_CAPAS);
  const activas = todas.filter(k=>BD_VISIBLE[k]);
  todas.filter(k=>!BD_VISIBLE[k]).forEach(k=>BD_GRUPOS[k].clearLayers());
  est.textContent = 'Cargando…';
  try{
    const resultados = await Promise.all(activas.map(k=>bdLlamar(BD_CAPAS[k].fn, bounds)));
    if(pedido !== BD_PEDIDO || !BD_MAPA) return; // respuesta antigua: se descarta
    const conteo = [], avisos = [];
    activas.forEach((k, i)=>{
      const datos = resultados[i];
      BD_VISTA[k] = datos.features;
      BD_GRUPOS[k].clearLayers();
      // interactive:false: los polígonos no capturan el ratón; el clic lo recibe el mapa
      L.geoJSON(datos, {
        interactive: false,
        filter: f => !!f.geometry,
        style: {color:BD_CAPAS[k].color, weight:1, fillOpacity:.15}
      }).addTo(BD_GRUPOS[k]);
      conteo.push(`${datos.features.length} ${BD_CAPAS[k].nombre.toLowerCase()}`);
      if(datos.features.length >= BD_LIMITE) avisos.push(BD_CAPAS[k].nombre);
    });
    todas.filter(k=>!BD_VISIBLE[k]).forEach(k=>{ BD_VISTA[k] = []; });
    if(BD_RESALTE) BD_RESALTE.bringToFront();
    let texto = activas.length ? `Mostrando ${conteo.join(' · ')} en esta vista.` : 'No hay capas activas.';
    if(avisos.length) texto += ` Hay más de ${BD_LIMITE} en: ${avisos.join(', ')}. Acerca el mapa para verlos todos.`;
    est.textContent = texto;
  }catch(e){
    console.error('Mapa en vivo: error al cargar', e);
    if(pedido === BD_PEDIDO && $('bd-est')) $('bd-est').textContent = 'No se pudo cargar: ' + e.message;
  }
}

// =====================================================================
//  EVENTOS GLOBALES Y ARRANQUE
// =====================================================================
$('salir').onclick = ()=>cerrarSesion();
$('campana').onclick = ()=>{ vista = 'notificaciones'; render(); };

cargarEstado();
if(USUARIO) generarAvisos();
render();
</script>
