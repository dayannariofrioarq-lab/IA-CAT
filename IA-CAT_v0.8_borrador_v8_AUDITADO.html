<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA-CAT v0.7 · Plataforma de inspección</title>
<style>
  :root{
    --navy:#0f2a44; --navy2:#173a5e; --blue:#1d6fb8; --teal:#14a095; --teal2:#0f7f76;
    --amber:#d9961a; --red:#c94a44; --green:#1f9d6b;
    --ink:#14212e; --muted:#5f7185; --line:#dbe5ec; --bg:#f3f6f9; --card:#ffffff;
    --shadow:0 1px 2px rgba(16,32,50,.06),0 4px 14px rgba(16,32,50,.06);
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.2px} h2{font-size:17px;margin:0 0 8px} h3{font-size:14px;margin:18px 0 8px;color:var(--navy);font-weight:700}
  .muted{color:var(--muted);font-size:12.5px;line-height:1.5}
  i.n{color:#93a2b1;font-style:normal}

  /* ---------- LOGIN ---------- */
  #login{min-height:100%;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 10% -10%,#1c4d78 0%,transparent 60%),linear-gradient(160deg,var(--navy),#0b1d31)}
  .login-card{background:#fff;border-radius:18px;box-shadow:0 30px 60px rgba(0,0,0,.35);padding:30px;width:min(640px,100%)}
  .marca{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px;color:var(--navy)}
  .marca .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--blue));display:grid;place-items:center;color:#fff;font-size:15px}
  .users{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
  .user{border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;text-align:left;cursor:pointer;font:inherit;transition:.15s}
  .user:hover{border-color:#9fc3dd}
  .user.on{border-color:var(--teal);box-shadow:0 0 0 3px rgba(20,160,149,.15)}
  .user b{display:block;color:var(--ink)} .user span{font-size:12px;color:var(--muted)}
  .user.pub{grid-column:span 2}

  /* ---------- SHELL ---------- */
  #app{display:none;min-height:100%;grid-template-columns:232px 1fr}
  .side{background:linear-gradient(180deg,var(--navy),#0b2036);color:#c9d8e6;padding:18px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
  .side .marca{color:#fff;padding:0 8px}
  .side .marca .logo{background:linear-gradient(135deg,var(--teal),#4aa6e8)}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .nav button{background:transparent;border:0;color:#b5c7d8;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer;font:inherit;display:flex;gap:10px;align-items:center}
  .nav button .ic{width:18px;text-align:center;color:#7fb8e6}
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav button.on{background:rgba(20,160,149,.18);color:#fff;box-shadow:inset 3px 0 0 var(--teal)}
  .nav .sep{font-size:10px;letter-spacing:1px;color:#6f8aa3;padding:10px 10px 2px;text-transform:uppercase}
  .perfil{margin-top:auto;background:rgba(255,255,255,.06);border-radius:11px;padding:10px;font-size:12px}
  .perfil b{color:#fff;display:block}
  .contenido{display:flex;flex-direction:column;min-width:0}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  .top .titulo{font-size:16px;font-weight:700;color:var(--navy)}
  .top .acc{display:flex;gap:8px;align-items:center}
  .btn-ico{position:relative;border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:38px;cursor:pointer;font-size:16px;color:var(--navy)}
  .badge-n{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;font-weight:700;display:none}
  .aviso{background:#fff7e0;color:#7a5200;font-size:12px;padding:8px 22px;border-bottom:1px solid #f1dfa6}
  main{padding:18px 22px 40px;min-width:0}
  .tri{display:grid;grid-template-columns:300px minmax(0,1fr) 380px;gap:14px;align-items:start}
  .card-col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
  .card-col.mapa{padding:0;overflow:hidden;position:relative;height:calc(100vh - 150px)}
  #colFicha{max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:78px}
  #colLista{max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:78px}
  .col-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .wide{width:100%}

  /* ---------- CONTROLES ---------- */
  input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;padding:9px 10px;border:1px solid #cfdbe5;border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid #9fd6d1;border-color:var(--teal)}
  textarea{min-height:64px;resize:vertical}
  label.campo{display:block;font-size:12px;color:var(--muted);margin:10px 0;font-weight:600}
  label.campo input,label.campo select,label.campo textarea{margin-top:5px;font-weight:400}
  .btn{background:linear-gradient(180deg,var(--blue),#17609f);color:#fff;border:0;border-radius:9px;padding:9px 15px;cursor:pointer;font:inherit;font-weight:600;margin:6px 6px 0 0;box-shadow:0 2px 6px rgba(29,111,184,.25)}
  .btn:hover{filter:brightness(1.05)}
  .btn.sec{background:#fff;color:#20516f;border:1px solid #b8cbd9;box-shadow:none}
  .btn.ok{background:linear-gradient(180deg,#1fb08f,var(--teal2));box-shadow:0 2px 6px rgba(20,160,149,.25)}
  .btn.no{background:linear-gradient(180deg,#d9605a,#b03f3a);box-shadow:none}
  .btn.mini{padding:5px 9px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .chip{border:1px solid #cfdbe5;background:#fff;border-radius:16px;padding:4px 11px;font-size:12px;cursor:pointer;color:#33465a}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.wa{border-color:#e8c57a;background:#fff8e6;color:#7a5200}
  .item{padding:10px;border-radius:10px;cursor:pointer;margin-bottom:5px;border:1px solid transparent}
  .item:hover{background:#f5f9fb} .item.active{background:#eaf7f5;border-color:#b5e0da}
  .lab{font-size:10.5px;letter-spacing:.8px;color:#7d8fa0;font-weight:700;margin:16px 0 7px;text-transform:uppercase}
  .capa{display:flex;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
  .leyenda{display:flex;gap:10px;font-size:11.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.2px}
  .ALTA{background:#fde8e6;color:#a1342e} .MEDIA{background:#fff1d6;color:#8a5a00} .BAJA{background:#dff5ec;color:#16714f}
  .float-r{float:right}
  .badge{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle;white-space:nowrap;letter-spacing:.2px}
  .FUENTE{background:#e2eefb;color:#1b5a8a} .CALCULADO{background:#dff5ec;color:#16714f}
  .IA{background:#efe8fb;color:#5f3ea0} .VALIDADO{background:#fff0cf;color:#8a5a00} .SIN{background:#eef1f3;color:#5c6b75}

  /* ---------- FICHA ---------- */
  .prio{padding:12px 14px;border-radius:11px;font-size:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
  .prio.ALTA{background:#fde8e6} .prio.MEDIA{background:#fff1d6} .prio.BAJA{background:#dff5ec}
  .motivo,.brecha,.valid{padding:9px 11px;margin:6px 0;font-size:12.5px;line-height:1.45;border-radius:0 9px 9px 0}
  .motivo{background:#fff8ea;border-left:3px solid var(--amber)}
  .brecha{background:#fbf2f2;border-left:3px solid #b84b45}
  .valid{background:#eaf7f5;border-left:3px solid var(--teal)}
  .row{display:grid;gap:3px;padding:8px 0;border-bottom:1px solid #eef3f6;font-size:12.5px}
  .row .k{color:var(--muted);font-size:11.5px}

  /* ---------- MAPA ---------- */
  .mapa svg{width:100%;height:100%;display:block;background:linear-gradient(180deg,#eaf4f6,#dcebef);cursor:grab;user-select:none}
  .mapa svg:active{cursor:grabbing}
  /* Leaflet dibuja sus polígonos en un <svg> interno: la regla general de arriba lo tapaba con
     un fondo degradado y lo estiraba. Se anula solo para los mapas Leaflet. */
  .leaflet-container svg{background:none !important;width:auto !important;height:auto !important;max-width:none !important;cursor:inherit !important}
  .ctrl{position:absolute;right:14px;top:14px;display:grid;gap:6px;z-index:2}
  .ctrl button{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:17px;color:#3f5a70;cursor:pointer;box-shadow:var(--shadow)}
  .mapa-leg{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;box-shadow:var(--shadow)}
  #tip{position:fixed;display:none;background:#0f2a44;color:#fff;padding:8px 11px;border-radius:8px;font-size:12px;pointer-events:none;z-index:50;max-width:280px;line-height:1.45;box-shadow:0 8px 20px rgba(0,0,0,.25)}

  /* ---------- KPIs / PANEL ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--teal))}
  .kpi b{display:block;font-size:24px;color:var(--navy);letter-spacing:-.3px}
  .kpi span{font-size:12px;color:var(--muted)}
  .barra{height:9px;background:#eef3f6;border-radius:8px;overflow:hidden;margin:5px 0 12px}
  .barra i{display:block;height:100%;border-radius:8px}
  .bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
  .bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
  .bars div i{display:block;width:100%;max-width:34px;background:linear-gradient(180deg,var(--teal),var(--blue));border-radius:6px 6px 0 0;min-height:2px}
  .bars div b{color:var(--navy);font-size:11px;margin-bottom:3px}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;margin:6px 0}
  th,td{text-align:left;padding:8px 9px;border-bottom:1px solid #eef3f6;vertical-align:top}
  th{background:#f5f8fa;color:var(--muted);font-size:11.5px;font-weight:700;position:sticky;top:0}
  th:first-child{border-radius:8px 0 0 0} th:last-child{border-radius:0 8px 0 0}
  tr:hover td{background:#fbfdfe}

  /* ---------- TAREAS / TARJETAS ---------- */
  .card{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;background:#fff;box-shadow:var(--shadow)}
  .card.pend{border-left:4px solid var(--amber)} .card.apr{border-left:4px solid var(--teal)} .card.rec{border-left:4px solid var(--red)}
  .card.alta{border-left:4px solid var(--red)} .card.media{border-left:4px solid var(--amber)} .card.baja{border-left:4px solid var(--green)}
  .cab-card{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .notif{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:8px;box-shadow:var(--shadow)}
  .notif.nueva{border-color:#9ed8cf;background:#f6fcfb}
  .notif .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:none;background:#eef4f8;color:var(--navy)}
  .notif .ico.inspeccion{background:#e2eefb} .notif .ico.ubicacion{background:#fde8e6} .notif .ico.decision{background:#dff5ec}
  .notif .ico.asignacion{background:#efe8fb} .notif .ico.venc{background:#fff1d6} .notif .ico.sinvisita{background:#fde8e6} .notif .ico.pend{background:#fff1d6}
  .notif .cuerpo{flex:1;min-width:0}
  .notif .cuerpo b{font-size:13.5px}
  .notif .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
  .msg{background:#f7fafc;border:1px solid var(--line);border-radius:var(--r);padding:14px;white-space:pre-wrap;line-height:1.55;font-size:13px}

  /* ---------- FOTOS ---------- */
  .checklist{display:grid;gap:10px;margin:10px 0}
  .cat{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#fff}
  .cat-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .cat-head b{font-size:13.5px}
  .req{font-size:10px;background:#fde8e6;color:#a1342e;border-radius:6px;padding:2px 6px;font-weight:700;margin-left:6px}
  .opt{font-size:10px;background:#eef1f3;color:#5c6b75;border-radius:6px;padding:2px 6px;font-weight:700;margin-left:6px}
  .ok-tag{font-size:10px;background:#dff5ec;color:#16714f;border-radius:6px;padding:2px 6px;font-weight:700}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
  .foto{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f5f8fa}
  .foto img{width:100%;height:96px;object-fit:cover;display:block}
  .foto .pie{font-size:10.5px;padding:4px 6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foto .q{position:absolute;top:5px;left:5px;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.92)}
  .foto .q.warn{background:#fff1d6;color:#8a5a00} .foto .q.bien{background:#dff5ec;color:#16714f}
  .foto .x{position:absolute;top:5px;right:5px;background:rgba(15,42,68,.8);color:#fff;border:0;border-radius:6px;width:22px;height:22px;cursor:pointer}
  .val{border-radius:var(--r);padding:12px 14px;margin:12px 0;font-size:12.5px;line-height:1.5}
  .val.bloq{background:#fde8e6;border:1px solid #f2b8b3}
  .val.avis{background:#fff8ea;border:1px solid #f1d59a}
  .val.bien{background:#eaf7f5;border:1px solid #b5e0da}
  .verif{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0;background:#fbfdfe}
  .verif b{font-size:13px}
  .radios{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .radios label{display:inline-flex;align-items:center;gap:5px;border:1px solid #cfdbe5;border-radius:16px;padding:5px 11px;font-size:12px;cursor:pointer;background:#fff}
  .gps{font-size:12px;color:var(--muted);margin:6px 0}

  /* ---------- MENSAJES ---------- */
  .grid2{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;align-items:start}
  .nota{font-size:11.5px;color:var(--muted);background:#f5f8fa;border-radius:9px;padding:8px 10px;margin-top:8px}

  /* ---------- AUX ---------- */
  .resumen{background:#f5f9fb;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;margin:10px 0}
  .firmas{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:44px;font-size:12px}
  .firmas div{border-top:1px solid #555;padding-top:5px;text-align:center}
  .pagina{border-bottom:1px dashed #cbd5dc;padding-bottom:18px;margin-bottom:20px}
  .cab-inf{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);border-bottom:2px solid var(--navy);padding-bottom:6px;margin-bottom:12px}
  .aviso-doc{background:#fff7e0;color:#7a5200;font-size:11px;padding:6px 9px;border-radius:7px;margin:8px 0}
  .fotos-inf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
  .fotos-inf img{width:100%;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
  .fotos-inf span{font-size:10px;color:var(--muted)}
  .acc-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .empty{text-align:center;color:var(--muted);padding:34px 12px}
  .empty b{display:block;color:var(--navy);font-size:15px;margin-bottom:4px}
  #toast{position:fixed;right:18px;bottom:18px;background:#0f2a44;color:#fff;padding:12px 16px;border-radius:10px;font-size:12.5px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;max-width:420px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.3)}
  #toast.on{opacity:1;transform:none}

  /* ---------- LISTA DE VERIFICACIÓN Y FICHA DE VISITA ---------- */
  .chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
  .chk{font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;display:flex;gap:8px;align-items:flex-start;cursor:pointer;line-height:1.35}
  .chk input{margin-top:2px}
  .chk:has(input:checked){border-color:#9ed8cf;background:#f3fbfa}
  #impVisita{display:none}

  /* ---------- FUENTES, CARGA Y AGREGAR (v0.6) ---------- */
  .btnfile{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px dashed #9fc3dd;border-radius:9px;text-align:left;padding:12px;margin:8px 0;cursor:pointer;font-weight:600;color:var(--navy);font-size:13px;line-height:1.3}
  .btnfile:hover{border-color:var(--teal);background:#f6fcfb}
  .btnfile input[type=file]{width:100%;margin:0;font-size:12px;font-weight:400;color:var(--muted)}
  .resumen b{color:var(--navy)}

  /* ---------- MI ESPACIO DE EVIDENCIA ---------- */
  .cmp-ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
  .cmp{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:12px;background:#0f2a44;margin-top:12px;box-shadow:var(--shadow)}
  .cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
  .cmp-line{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.45);transform:translateX(-1px);pointer-events:none}
  .cmp-etq{position:absolute;top:10px;font-size:11.5px;font-weight:700;color:#fff;background:rgba(15,42,68,.75);padding:4px 9px;border-radius:7px}
  .cmp-etq.izq{left:10px} .cmp-etq.der{right:10px}
  .galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:10px}
  .gfoto{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
  .gfoto:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(16,32,50,.12)}
  .gfoto.sel{border-color:var(--teal);box-shadow:0 0 0 2px rgba(20,160,149,.25)}
  .gfoto img{width:100%;height:150px;object-fit:cover;display:block}
  .gfoto .sinimg{height:150px;display:grid;place-items:center;background:#f2f5f8;color:var(--muted);font-size:12px;text-align:center;padding:10px}
  .gfoto .gpie{font-size:11.5px;color:var(--muted);padding:8px 10px 2px}
  .gfoto .acc-row{padding:0 10px}
  .gfoto .pie-in{font-size:12px;padding:6px 8px}
  .gfoto .btn{margin:8px 10px 10px}
  .tagx{display:inline-block;background:#eaf7f5;color:#0f6f67;border-radius:8px;padding:4px 9px;margin:3px 4px 0 0;font-size:12px}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:1180px){
    .tri{grid-template-columns:260px minmax(0,1fr)}
    #colFicha{grid-column:1 / -1;position:static;max-height:none}
  }
  @media (max-width:880px){
    #app{grid-template-columns:1fr}
    .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
    .nav{flex-direction:row;flex-wrap:wrap;margin:0}
    .nav .sep{display:none}
    .perfil{display:none}
    .tri{grid-template-columns:1fr}
    #colLista,#colFicha{position:static;max-height:none}
    .card-col.mapa{height:60vh}

// Un registro es de simulación si lleva la marca simulado, o si tiene una huella inequívoca
// de los datos de ejemplo. Los códigos de predio NO se usan como huella: pueden coincidir con datos reales.
function esSimulado(tipo, x){
  if(!x) return false;
  if(x.simulado === false) return false; // marcado como dato real (p. ej. conservado con registros reales)
  if(x.simulado === true) return true;
  if(tipo === 'predio')     return S.fuenteDatos === 'ejemplo' && CODIGOS_SIMULACION_ANTIGUOS.has(x.codigo); // guardados antes de esta marca
  if(tipo === 'amenaza')    return x.fuente === 'Datos de ejemplo';
  if(tipo === 'inspeccion') return String(x.id || '').startsWith('INS-DEMO-');
  return false;
}
function haySimulacion(){
  return S.predios.some(p=>esSimulado('predio',p)) || S.amenazas.some(z=>esSimulado('amenaza',z)) ||
         Object.values(S.inspecciones).flat().some(i=>esSimulado('inspeccion',i));
}
// Borra SOLO registros de simulación. Los registros creados a mano se conservan.
// Un predio de simulación que tenga registros reales asociados se conserva y deja de estar marcado.
function quitarSimulacion(){
  Object.keys(S.inspecciones).forEach(c=>{
    S.inspecciones[c] = S.inspecciones[c].filter(i=>!esSimulado('inspeccion', i));
    if(!S.inspecciones[c].length) delete S.inspecciones[c];
  });
  // Un predio de ejemplo se conserva si tiene inspecciones reales (pasa a ser dato real).
  // Si solo tiene una asignación o actualización sin marca, no se puede clasificar con seguridad:
  // se conserva y sigue marcado para revisión.
  const conInspeccionReal = new Set(Object.keys(S.inspecciones));
  const paraRevision = new Set();
  Object.entries(S.asignaciones||{}).forEach(([c,a])=>{ if(!(a && a.simulado)) paraRevision.add(c); });
  S.actualizaciones.forEach(a=>{ if(!(a.simulado || String(a.id||'').includes('INS-DEMO-'))) paraRevision.add(a.codigo); });
  const quitados = new Set(), conservados = [], revision = [];
  S.predios = S.predios.filter(p=>{
    if(!esSimulado('predio', p)) return true;
    if(conInspeccionReal.has(p.codigo)){ p.simulado = false; conservados.push(p.codigo); return true; }
    if(paraRevision.has(p.codigo)){ p.simulado = true; revision.push(p.codigo); return true; }
    quitados.add(p.codigo); return false;
  });
  S.amenazas = S.amenazas.filter(z=>!esSimulado('amenaza', z));
  const esNotiSim = n => String(n.id||'').includes('INS-DEMO-') || n.simulado === true || (quitados.has(n.codigo));
  S.notificaciones = (S.notificaciones||[]).filter(n=>!esNotiSim(n));
  S.auditoria = (S.auditoria||[]).filter(a => !(quitados.has(a.codigo) || /prueba|simulaci|restaur.*datos/i.test(a.accion||'')));
  Object.keys(S.asignaciones||{}).forEach(c=>{ const a=S.asignaciones[c]; if(quitados.has(c) || (a && a.simulado)) delete S.asignaciones[c]; });
  S.actualizaciones = S.actualizaciones.filter(a=>!(quitados.has(a.codigo) || a.simulado || String(a.id||'').includes('INS-DEMO-')));
  Object.keys(S.fuentesPDF||{}).forEach(c=>{ if(quitados.has(c)) delete S.fuentesPDF[c]; });
  return {predios: quitados.size, conservados: conservados.length, paraRevision: revision};
}

  if(!S.predios.length) return 'Sin datos reales cargados en este navegador';

}

const DB = (()=>{
  let db = null;
  function abrir(){
    return new Promise((res,rej)=>{
      if(db) return res(db);
      const r = indexedDB.open('iacat-fotos', 2);
      r.onupgradeneeded = ()=>{
        const d = r.result;
        if(!d.objectStoreNames.contains('fotos')) d.createObjectStore('fotos', {keyPath:'id'});
        if(!d.objectStoreNames.contains('documentos')) d.createObjectStore('documentos', {keyPath:'id'});
      };
      r.onsuccess = ()=>{ db=r.result; res(db); };
      r.onerror = ()=>rej(r.error);
    });
  }
  async function op(modo, fn, store='fotos'){
    await abrir();
    return new Promise((res,rej)=>{
      const t = db.transaction(store, modo);
      const req = fn(t.objectStore(store));
      t.oncomplete = ()=>res(req.result);
      t.onerror = ()=>rej(t.error);
      t.onabort = ()=>rej(t.error);
    });
  }
  return {
    guardar: f => op('readwrite', st=>st.put(f)),
    obtener: id => op('readonly', st=>st.get(id)),
    todas: () => op('readonly', st=>st.getAll()),
    borrar: id => op('readwrite', st=>st.delete(id)),
    guardarDoc: f => op('readwrite', st=>st.put(f), 'documentos'),
    obtenerDoc: id => op('readonly', st=>st.get(id), 'documentos')
  };
})();

function notificar({tipo, titulo, cuerpo, codigo='', roles=[], usuarios=[], clave=null}){

    tipo, titulo, cuerpo, codigo, roles, usuarios, leidas:[]});

  return true;
}

function generarAvisos(){
  if(!S.predios.length) return;
  const mes = hoy().slice(0,7);
  S.predios.forEach(p=>{
    const e = evaluar(p);
    if(e.prioridad==='ALTA' && !vigente(p.codigo)){
      notificar({tipo:'sinvisita', titulo:`Predio de prioridad alta sin visita: ${p.codigo}`,
        cuerpo:`No hay inspección en los últimos ${S.reglas.diasInspeccion} días. ${e.motivos[0]||''}`,
        codigo:p.codigo, roles:['supervisor'], clave:`sinvisita|${p.codigo}|${mes}`});
    }
  });
  Object.entries(S.asignaciones).forEach(([codigo,a])=>{
    const hechas = (S.inspecciones[codigo]||[]).some(r=>r.fecha>=a.fecha);
    if(!hechas && a.plazo < hoy()){
      notificar({tipo:'venc', titulo:`Plazo vencido: ${codigo}`,
        cuerpo:`La visita asignada a ${a.nombre} venció el ${a.plazo}.`, codigo,
        roles:['supervisor'], usuarios:[a.inspector], clave:`venc|${codigo}|${a.plazo}`});
    }
  });
  S.actualizaciones.filter(a=>a.estado==='pendiente' && a.fecha < sumarDias(-7)).forEach(a=>{
    notificar({tipo:'pend', titulo:`Actualización pendiente hace más de 7 días: ${a.codigo}`,
      cuerpo:`${ETIQ[a.campo]}: propuesta por ${a.tecnico} el ${a.fecha}.`, codigo:a.codigo,
      roles:['supervisor'], clave:`pend|${a.id}`});
  });
  guardar();
}

function areaPoligono(p){
  let a=0; for(let i=0;i<p.length;i++){ const [x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length]; a+=x1*y2-x2*y1; } return Math.abs(a)/2;
}
function dentro(pt, poly){
  let c=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const [xi,yi]=poly[i],[xj,yj]=poly[j];
    if(((yi>pt[1])!==(yj>pt[1])) && (pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi)) c=!c;
  }
  return c;
}
function bbox(poly){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const [x,y] of poly){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  return {x0,y0,x1,y1};
}
function orient(a,b,c){ return (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]); }
function enSegmento(a,b,c){ return Math.min(a[0],b[0])<=c[0] && c[0]<=Math.max(a[0],b[0]) && Math.min(a[1],b[1])<=c[1] && c[1]<=Math.max(a[1],b[1]); }
function segmentosCruzan(p1,p2,p3,p4){
  const o1=orient(p1,p2,p3), o2=orient(p1,p2,p4), o3=orient(p3,p4,p1), o4=orient(p3,p4,p2);
  if(((o1>0&&o2<0)||(o1<0&&o2>0)) && ((o3>0&&o4<0)||(o3<0&&o4>0))) return true;
  return (o1===0&&enSegmento(p1,p2,p3)) || (o2===0&&enSegmento(p1,p2,p4)) || (o3===0&&enSegmento(p3,p4,p1)) || (o4===0&&enSegmento(p3,p4,p2));
}
// Dos polígonos se intersectan si algún vértice de uno cae dentro del otro
// o si alguna arista de uno cruza una arista del otro (franjas que atraviesan un predio).
function cruzan(a,b){
  const A=bbox(a), B=bbox(b);
  if(A.x1<B.x0 || B.x1<A.x0 || A.y1<B.y0 || B.y1<A.y0) return false;
  if(a.some(p=>dentro(p,b)) || b.some(p=>dentro(p,a))) return true;
  for(let i=0;i<a.length;i++){
    const p1=a[i], p2=a[(i+1)%a.length];
    for(let j=0;j<b.length;j++){
      if(segmentosCruzan(p1,p2,b[j],b[(j+1)%b.length])) return true;
    }
  }
  return false;
}
function centroide(g){ return {x:g.reduce((s,c)=>s+c[0],0)/g.length, y:g.reduce((s,c)=>s+c[1],0)/g.length}; }
function centroLatLon(p){
  if(!S.origen || !S.origen.geo) return null;
  const c = centroide(p.geometria);
  return { lat: S.origen.y0 + c.y/110540, lon: S.origen.x0 + c.x/(111320*Math.cos(S.origen.y0*Math.PI/180)) };
}
function distanciaM(a,b){
  const R=6371000, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// =====================================================================
//  VALORES VIGENTES Y TRAZABILIDAD
//  Orden: aprobación (VALIDADO) > dato PDF registrado (FUENTE) > catastro (FUENTE) > SIN DATO
// =====================================================================
function valorVigente(p, campo){
  const ap = S.actualizaciones.filter(a=>a.codigo===p.codigo && a.campo===campo && a.estado==='aprobada')
                              .sort((a,b)=>(a.fecha_decision||'').localeCompare(b.fecha_decision||''));
  if(ap.length){ const u=ap[ap.length-1]; return {valor:u.propuesto, origen:'VALIDADO', ref:`Aprobado ${u.fecha_decision} por ${u.decidido_por||'—'}`}; }
  const pdf = (S.fuentesPDF[p.codigo]||{})[campo];
  if(pdf && pdf.valor!=null && pdf.valor!=='') return {valor:pdf.valor, origen:'FUENTE', ref:`PDF: ${pdf.ref}`};
  const f = (p.fuente||{})[campo];
  if(f!=null && f!=='') return p.origen==='manual'
    ? {valor:f, origen:'VALIDADO', ref:`Registro manual (${p.registrado_por||'—'})`}
    : {valor:f, origen:'FUENTE', ref:'Catastro'};
  return {valor:null, origen:'SIN DATO', ref:'Sin fuente'};
}
function vigente(codigo){
  const reg = S.inspecciones[codigo]||[];
  if(!reg.length) return false;
  const ult = reg.map(r=>r.fecha).sort().pop();
  return (Date.now() - new Date(ult+'T00:00:00'))/86400000 <= S.reglas.diasInspeccion;
}
// Caché de evaluar(): se invalida cada vez que cambia el estado (guardar) o el día.
let EVAL_VER = 0;
const EVAL_CACHE = new Map();
function evaluar(p){
  const clave = EVAL_VER + '|' + hoy();
  const c = EVAL_CACHE.get(p.codigo);
  if(c && c.clave===clave && c.p===p) return c.res;
  const res = calcularEvaluacion(p);
  EVAL_CACHE.set(p.codigo, {clave, p, res});
  return res;
}
// Los textos de motivos/brechas son texto plano: se escapan al pintarlos en HTML.
function calcularEvaluacion(p){
  const motivos=[], brechas=[], validar=[];
  const zonas = S.amenazas.filter(z=>cruzan(p.geometria, z.geometria));
  zonas.forEach(z=>motivos.push(`Intersecta «${z.nombre}» (${z.fuente}, ${z.fecha}).`));
  const regs = (S.inspecciones[p.codigo]||[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const ult = regs[0];
  const malo = !!(ult && ult.valores && ult.valores.estado_conservacion==='Malo');
  if(malo) motivos.push(`Última inspección (${ult.fecha}) registra estado de conservación malo.`);
  if(ult && ult.discrepancias) motivos.push(`Última inspección (${ult.fecha}) registra discrepancias con el catastro.`);
  const pend = S.actualizaciones.filter(a=>a.codigo===p.codigo && a.estado==='pendiente');
  if(pend.length){ motivos.push(`${pend.length} actualización(es) pendiente(s) de aprobación.`); validar.push('Revisar y decidir las actualizaciones pendientes.'); }
  if(!vigente(p.codigo)){ motivos.push(`Sin inspección en los últimos ${S.reglas.diasInspeccion} días.`); validar.push('Programar visita de verificación y registrar fotografías.'); }
  if(valorVigente(p,'uso').valor==null) brechas.push('Falta el uso de edificación.');
  if(valorVigente(p,'direccion').valor==null) brechas.push('Falta la dirección.');
  if((p.fuente||{}).area_fuente==null) brechas.push('Falta el área registrada en la fuente.');
  const sinC = ['pisos','material','tipo_construccion'].filter(c=>valorVigente(p,c).valor==null);
  if(sinC.length) brechas.push(`Sin datos de construcción validados: ${sinC.map(c=>ETIQ[c].toLowerCase()).join(', ')}.`);
  const areaCalc = areaPoligono(p.geometria);
  const aF = (p.fuente||{}).area_fuente;
  if(aF!=null){
    const dif = Math.abs(areaCalc-aF)/aF;
    if(dif > S.reglas.umbralArea) brechas.push(`El área del archivo (${fmt(aF)} m²) difiere ${Math.round(dif*100)}% de la geometría (${fmt(areaCalc)} m²).`);
  }
  if(brechas.length) validar.push('Completar o confirmar en campo los datos faltantes.');
  if(zonas.length) validar.push('Verificar en campo el alcance real de la amenaza.');
  const prioridad = (zonas.length || (malo && S.reglas.maloEsAlta)) ? 'ALTA' : (motivos.length || brechas.length) ? 'MEDIA' : 'BAJA';
  return {zonas, motivos, brechas, validar, prioridad, areaCalc, ult, pend};
}

// =====================================================================
//  INSPECCIÓN → PROPUESTAS DE ACTUALIZACIÓN
// =====================================================================
function proponer(ins){
  const p = S.predios.find(x=>x.codigo===ins.codigo);
  if(!p) return 0;
  let n = 0;
  CAMPOS.forEach(c=>{
    const nuevo = ins.valores ? ins.valores[c] : null;
    if(nuevo==null || nuevo==='') return;
    if(ins.verificaciones && ins.verificaciones[c]==='no_verificable') return;
    const actual = valorVigente(p,c).valor;
    if(String(actual ?? '') === String(nuevo)) return;
    if(S.actualizaciones.some(a=>a.inspeccion_id===ins.id && a.campo===c)) return;
    S.actualizaciones.push({id:`ACT-${ins.id}-${c}`, codigo:p.codigo, campo:c, anterior:actual, propuesto:nuevo,
      inspeccion_id:ins.id, tecnico:ins.tecnico, inspector_id:ins.inspector_id||null, fecha:ins.fecha,
      estado:'pendiente', decidido_por:null, fecha_decision:null, motivo:null});
    n++;
  });
  return n;
}
function decidir(id, aprobar){
  const a = S.actualizaciones.find(x=>x.id===id); if(!a) return;
  const quien = prompt('Nombre de quien decide:', USUARIO ? USUARIO.nombre : '');
  if(!quien || !quien.trim()){ show('Se necesita el nombre de quien decide'); return; }
  let motivo = null;
  if(!aprobar){
    motivo = prompt('Motivo del rechazo (obligatorio):', '');
    if(!motivo || !motivo.trim()){ show('El rechazo necesita un motivo'); return; }
  }
  a.estado = aprobar ? 'aprobada' : 'rechazada';
  a.decidido_por = quien.trim(); a.fecha_decision = hoy(); a.motivo = motivo ? motivo.trim() : null;
  notificar({tipo:'decision', titulo:`Actualización ${aprobar?'aprobada':'rechazada'}: ${a.codigo}`,
    cuerpo:`${ETIQ[a.campo]}: ${aprobar?'aprobada':'rechazada'} por ${a.decidido_por}${a.motivo?'. Motivo: '+a.motivo:''}.`,
    codigo:a.codigo, roles: a.inspector_id ? [] : ['inspector'], usuarios: a.inspector_id ? [a.inspector_id] : []});
  registrar(aprobar?'aprobó actualización':'rechazó actualización', a.codigo, `${ETIQ[a.campo]}`);
  guardar(); render();
  show(aprobar ? 'Actualización aprobada: queda como dato VALIDADO' : 'Actualización rechazada; el motivo queda en el historial');
}

const MAPEO = {
  codigo:['codigo','COD_CATA','CODIGO_PREDIO','ID_PREDIO','cod_cata'], uso:['Uso_de_Edi','uso','USO'],
  direccion:['Direccion','direccion','DIRECCION'], lindero_norte:['Lindero_No'], lindero_sur:['Lindero_Su'],
  lindero_este:['Lindero_Es'], lindero_oeste:['Lindero_Oe'], frente_norte:['Longitud_N'], frente_sur:['Longitud_S'],
  frente_este:['Longitud_E'], frente_oeste:['Longitud_O'], area_fuente:['SHAPE__Area'], perimetro_fuente:['SHAPE__Length'],
  nombre:['nombre','NOMBRE','name','NAME','Name','tipo','TIPO']
};
const campoGeo = (pr,nombres) => { for(const n of nombres){ if(pr[n]!=null && pr[n]!=='') return pr[n]; } return null; };
const numero = x => { if(x==null) return null; const n=parseFloat(String(x).replace(',','.')); return isNaN(n)?null:n; };
function anillo(geom){
  if(!geom) return null;
  const polis = geom.type==='Polygon' ? [geom.coordinates] : geom.type==='MultiPolygon' ? geom.coordinates : null;
  if(!polis) return null;
  let mejor=null, mejorA=-1;
  polis.forEach(p=>{ const r=p[0]; const a=areaPoligono(r); if(a>mejorA){ mejorA=a; mejor=r; } });
  return mejor;
}
function aMetros(anillos, origen){
  let x0,y0,geo;
  if(origen){ ({x0,y0,geo}=origen); }
  else{
    const todos = anillos.flat();
    x0 = todos.reduce((mn,c)=>Math.min(mn,c[0]), Infinity);
    y0 = todos.reduce((mn,c)=>Math.min(mn,c[1]), Infinity);
    geo = todos.every(c=>Math.abs(c[0])<=180 && Math.abs(c[1])<=90);
  }
  const kx = geo ? 111320*Math.cos(y0*Math.PI/180) : 1, ky = geo ? 110540 : 1;
  return {res: anillos.map(r=>r.map(c=>[+(((c[0]-x0)*kx).toFixed(2)), +(((c[1]-y0)*ky).toFixed(2))])), origen:{x0,y0,geo}};
}
async function importarGeo(archivo, tipo){
  if(!puede('importar')){ show('Solo el supervisor puede importar datos'); return; }
  try{
    const fc = proyectarAGeo(await leerCapa(archivo), ($('d-sis')||{}).value || 'auto');
    if(tipo==='predios') avisarColumnas(fc);
    const pares = (fc.features||[]).map(f=>({props:f.properties||{}, ring:anillo(f.geometry)})).filter(p=>p.ring);
    if(!pares.length){ show('El archivo no tiene polígonos válidos'); return; }
    if(tipo==='predios'){
      const {res, origen} = aMetros(pares.map(p=>p.ring));
      const hayTrabajo = Object.keys(S.inspecciones).length || S.actualizaciones.length || Object.keys(S.asignaciones).length || Object.keys(S.fuentesPDF).length;
      if(hayTrabajo && !confirm('Cargar estos predios reemplaza la base actual. Se conservan las inspecciones, asignaciones y propuestas de los códigos que sigan existiendo; el resto se elimina. ¿Continuar?')) return;
      S.origen = origen;
      S.predios = pares.map((p,i)=>{
        const pr = p.props;
        return {
          codigo: String(campoGeo(pr,MAPEO.codigo) ?? `sin-codigo-${i+1}`),
          fid: campoGeo(pr,['FID','fid']),
          fuente: {
            uso: campoGeo(pr,MAPEO.uso), direccion: campoGeo(pr,MAPEO.direccion),
            linderos:{norte:campoGeo(pr,MAPEO.lindero_norte), sur:campoGeo(pr,MAPEO.lindero_sur), este:campoGeo(pr,MAPEO.lindero_este), oeste:campoGeo(pr,MAPEO.lindero_oeste)},
            frentes:{norte:numero(campoGeo(pr,MAPEO.frente_norte)), sur:numero(campoGeo(pr,MAPEO.frente_sur)), este:numero(campoGeo(pr,MAPEO.frente_este)), oeste:numero(campoGeo(pr,MAPEO.frente_oeste))},
            area_fuente: numero(campoGeo(pr,MAPEO.area_fuente)), perimetro_fuente: numero(campoGeo(pr,MAPEO.perimetro_fuente))
          },
          geometria: res[i]
        };
      });
      const cods = new Set(S.predios.map(p=>p.codigo));
      S.inspecciones = Object.fromEntries(Object.entries(S.inspecciones).filter(([c])=>cods.has(c)));
      S.asignaciones = Object.fromEntries(Object.entries(S.asignaciones).filter(([c])=>cods.has(c)));
      S.actualizaciones = S.actualizaciones.filter(a=>cods.has(a.codigo));
      S.fuentesPDF = Object.fromEntries(Object.entries(S.fuentesPDF).filter(([c])=>cods.has(c)));
      S.fuenteDatos = 'archivo: ' + archivo.name;
      registrarFuente(archivo, 'predios', S.predios.length);
      sel = S.predios[0].codigo; VB = null;
      registrar('cargó predios', '', `${S.predios.length} predios desde ${archivo.name}`);
      show(`${S.predios.length} predios cargados. Se conservaron los registros de los códigos que siguen existiendo.`);
    } else {
      if(!S.origen) S.origen = {x0:0,y0:0,geo:false};
      const {res} = aMetros(pares.map(p=>p.ring), S.origen);
      S.amenazas = pares.map((p,i)=>({id:`A${i+1}`, nombre:String(campoGeo(p.props,MAPEO.nombre)||'Capa de amenaza'), tipo:'amenaza', fuente:archivo.name, fecha:hoy(), geometria:res[i]}));
      registrar('cargó zonas de amenaza', '', `${S.amenazas.length} zonas desde ${archivo.name}`);
      registrarFuente(archivo, 'amenaza', S.amenazas.length);
      show(`${S.amenazas.length} zona(s) de amenaza cargadas`);
    }
    guardar(); render();
  }catch(err){ console.error(err); show('No se pudo cargar: ' + err.message); }
}

// =====================================================================
//  FOTOS: COMPRESIÓN, CALIDAD Y DUPLICADOS (análisis sencillo, sin IA)
// =====================================================================
function cargarImagen(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('imagen no válida')); };
    img.src = url;
  });
}
function reducir(canvas,w,h){
  const s = document.createElement('canvas'); s.width=w; s.height=h;
  const g = s.getContext('2d'); g.drawImage(canvas,0,0,w,h);
  return g.getImageData(0,0,w,h).data;
}
function grises(d){ const g=[]; for(let i=0;i<d.length;i+=4) g.push(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]); return g; }
function analizarCalidad(canvas){
  const g = grises(reducir(canvas,32,32));
  const media = g.reduce((a,b)=>a+b,0)/g.length;
  let dif=0; for(let y=0;y<32;y++) for(let x=0;x<31;x++) dif+=Math.abs(g[y*32+x]-g[y*32+x+1]);
  const nitidez = +(dif/(32*31)).toFixed(1);
  const avisos=[];
  if(media<45) avisos.push('Muy oscura');
  if(media>235) avisos.push('Sobreexpuesta');
  if(nitidez<6) avisos.push('Posible poca nitidez');
  return {media:Math.round(media), nitidez, avisos};
}
function ahash(canvas){ const g=grises(reducir(canvas,8,8)); const mu=g.reduce((a,b)=>a+b,0)/64; return g.map(x=>x>mu?'1':'0').join(''); }
function distHash(a,b){ let n=0; for(let i=0;i<Math.min(a.length,b.length);i++) if(a[i]!==b[i]) n++; return n; }
async function procesarFoto(file, categoria){
  const img = await cargarImagen(file);
  const k = Math.min(1, 1280/Math.max(img.width,img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return {id:'FOTO-'+Date.now()+'-'+Math.floor(Math.random()*100000), categoria, nombre:file.name,
          dataUrl: c.toDataURL('image/jpeg',0.72), hash: ahash(c), calidad: analizarCalidad(c)};
}

// =====================================================================
//  VALIDACIÓN DE LA INSPECCIÓN ANTES DE ENVIAR
// =====================================================================
function validarTMP(p, tmp){
  const bloq=[], avis=[], bien=[];
  CATEGORIAS.filter(c=>c.req).forEach(c=>{ if(!tmp.fotos.some(f=>f.categoria===c.id)) bloq.push(`Falta la foto de ${c.t.toLowerCase()}.`); });
  const previas = (S.inspecciones[p.codigo]||[]).flatMap(r=>r.fotos||[]);
  tmp.fotos.forEach((f,i)=>{
    f.calidad.avisos.forEach(a=>avis.push(`${esc(f.nombre)}: ${a.toLowerCase()}.`));
    const dupTmp = tmp.fotos.some((o,j)=> j!==i && distHash(o.hash,f.hash)<=5);
    const dupPrev = previas.some(o=>distHash(o.hash,f.hash)<=5);
    if(dupTmp || dupPrev) avis.push(`${esc(f.nombre)}: parece duplicada de otra foto del predio.`);
  });
  let dist = null;
  const c = centroLatLon(p);
  if(tmp.gps && !c) avis.push('No se pudo comparar la ubicación GPS con el predio: la capa no tiene coordenadas geográficas. Revisa el sistema de coordenadas en Datos.');
  if(tmp.gps && c){
    dist = Math.round(distanciaM(tmp.gps, c));
    if(dist > S.reglas.umbralGPS) avis.push(`La ubicación de la visita está a ${dist} m del predio (umbral: ${S.reglas.umbralGPS} m).`);
    else bien.push(`Ubicación de la visita a ${dist} m del predio.`);
  } else if(!tmp.gps) avis.push('No se capturó la ubicación GPS de la visita.');
  else avis.push('El predio no tiene coordenadas geográficas cargadas; no se puede comparar la distancia.');
  if(!bloq.length && !avis.length) bien.push('Fotos requeridas completas y sin observaciones de calidad.');
  return {bloq, avis, bien, dist};
}

Se solicita revisar y completar los siguientes puntos en la próxima visita o con la documentación disponible:
${d.e.brechas.length ? d.e.brechas.map(x=>'- '+x).join('\n') : '- No hay brechas abiertas.'}
${d.e.ult && d.e.ult.discrepancias ? `\nDiscrepancia registrada: ${d.e.ult.discrepancias}` : ''}

Cuando tengas la información, registra la inspección para que la supervisión la revise.`;

Dirección registrada: ${d.dir.valor ?? 'No registrada en nuestros archivos'}
Uso registrado: ${d.uso.valor ?? 'No registrado en nuestros archivos'}

async function exportarPaquete(){
  const fotos = await DB.todas().catch(()=>[]);
  const pk = {tipo:'iacat-paquete', version:VERSION, creado:new Date().toISOString(), creado_por:USUARIO.nombre,
              inspecciones: Object.values(S.inspecciones).flat(), fotos};
  descargar(JSON.stringify(pk), `iacat-paquete-${hoy()}.json`, 'application/json');
  registrar('exportó paquete de inspecciones', '', `${pk.inspecciones.length} inspecciones, ${fotos.length} fotos`);
}
async function importarPaquete(archivo){
  try{
    const pk = JSON.parse(await archivo.text());
    if(pk.tipo!=='iacat-paquete' || !Array.isArray(pk.inspecciones)) throw new Error('tipo');
    const valida = ins => ins && typeof ins.id==='string' && typeof ins.codigo==='string' && /^\d{4}-\d{2}-\d{2}$/.test(ins.fecha||'') && ins.valores && typeof ins.valores==='object';
    const descartadas = pk.inspecciones.filter(i=>!valida(i)).length;
    let nuevas=0;
    pk.inspecciones.filter(valida).forEach(ins=>{
      ins.fotos = Array.isArray(ins.fotos) ? ins.fotos : [];
      S.inspecciones[ins.codigo] = S.inspecciones[ins.codigo] || [];
      if(!S.inspecciones[ins.codigo].some(r=>r.id===ins.id)){ S.inspecciones[ins.codigo].push(ins); proponer(ins); nuevas++; }
    });
    for(const f of pk.fotos||[]) await DB.guardar(f).catch(()=>{});
    notificar({tipo:'inspeccion', titulo:`Paquete importado: ${nuevas} inspección(es) nueva(s)`,
      cuerpo:`Creado por ${pk.creado_por} el ${String(pk.creado).slice(0,10)}.`, roles:['supervisor']});
    registrar('importó paquete de inspecciones', '', `${nuevas} nuevas`);
    guardar(); render(); show(`Paquete importado: ${nuevas} inspección(es) nueva(s)${descartadas?` · ${descartadas} descartada(s) por formato inválido`:''}`);
  }catch(err){ show('El archivo no es un paquete de IA-CAT válido'); }
}
async function exportarRespaldo(){
  const fotos = await DB.todas().catch(()=>[]);
  descargar(JSON.stringify({tipo:'iacat-respaldo', version:VERSION, creado:new Date().toISOString(), S, fotos}), `iacat-respaldo-${hoy()}.json`, 'application/json');
  registrar('exportó respaldo completo', '', '');
}
async function importarRespaldo(archivo){
  try{
    const g = JSON.parse(await archivo.text());
    if(g.tipo!=='iacat-respaldo' || !g.S || !Array.isArray(g.S.predios) || typeof g.S.inspecciones!=='object') throw new Error('tipo');
    if(!confirm(`Restaurar este respaldo reemplaza TODOS los datos actuales de este navegador (${g.S.predios.length} predios en el respaldo). ¿Continuar?`)) return;
    S = Object.assign(estadoInicial(), g.S);
    for(const f of g.fotos||[]) await DB.guardar(f).catch(()=>{});
    guardar(); VB=null; sel = S.predios[0] ? S.predios[0].codigo : null;
    registrar('importó respaldo completo', '', '');
    render(); show('Respaldo restaurado');
  }catch(err){ show('El archivo no es un respaldo válido de IA-CAT'); }
}
function descargar(contenido, nombre, tipo){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenido], {type:tipo}));
  a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
}

function limitesTotales(){
  const todos = [...S.predios.map(p=>p.geometria), ...S.amenazas.map(z=>z.geometria)].flat();
  if(!todos.length) return {x:0,y:-100,w:200,h:200};
  const xs=todos.map(c=>c[0]), ys=todos.map(c=>c[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const pad = Math.max(25,(x1-x0)*0.05);
  return {x:x0-pad, y:-y1-pad, w:(x1-x0)+2*pad, h:(y1-y0)+2*pad};
}
function aplicarVB(){ if(svgRef && VB) svgRef.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`); }
function zoom(f){
  if(!VB) return;
  const cx=VB.x+VB.w/2, cy=VB.y+VB.h/2;
  VB.w*=f; VB.h*=f; VB.x=cx-VB.w/2; VB.y=cy-VB.h/2; aplicarVB();
}
// ---------- Mapa base real (Leaflet + OpenStreetMap / satélite) ----------
// Se usa cuando los predios tienen coordenadas geográficas (S.origen.geo) y Leaflet cargó.
let LMAP = null, LVIEW = null, LBASE = 'calles';
const usarLeaflet = () => typeof L !== 'undefined' && S.origen && S.origen.geo;
function aLatLon(c){
  const o = S.origen;
  return [o.y0 + c[1]/110540, o.x0 + c[0]/(111320*Math.cos(o.y0*Math.PI/180))];
}
function deLatLon(ll){
  const o = S.origen;
  return [+((ll.lng-o.x0)*111320*Math.cos(o.y0*Math.PI/180)).toFixed(2), +((ll.lat-o.y0)*110540).toFixed(2)];
}
function renderMapaLeaflet(){
  const col = $('colCentro');
  if(LMAP){ try{ LMAP.remove(); }catch(e){} LMAP = null; }
  col.innerHTML = `<div id="lmap"></div>
    <div class="lctrl"><button id="l-home" title="Ver todos los predios">⌂ Ver todo</button></div>
    <div class="mapa-leg">${DRAW.modo ? 'Haz clic en el mapa para marcar los vértices' : 'Toca un predio para ver su ficha · arriba a la derecha cambias a satélite'}</div>`;
  // Los servidores de OpenStreetMap bloquean páginas abiertas como archivo local (error 403); CARTO sí permite este uso.
  const calles = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {maxZoom:19, subdomains:'abcd', attribution:'© OpenStreetMap contributors © CARTO'});
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Imágenes © Esri'});
  LMAP = L.map('lmap', {zoomControl:true, preferCanvas:true});
  let avisoTiles = false;
  [calles, sat].forEach(t=>t.on('tileerror', ()=>{ if(!avisoTiles){ avisoTiles = true; show('No se descargan los mosaicos del mapa. Revisa tu conexión a internet o prueba otro navegador.'); } }));
  (LBASE==='satelite' ? sat : calles).addTo(LMAP);
  L.control.layers({'Calles':calles, 'Satélite':sat}, null, {position:'topright'}).addTo(LMAP);
  LMAP.on('baselayerchange', e=>{ LBASE = e.name==='Satélite' ? 'satelite' : 'calles'; });

  const vis = new Set(visibles().map(x=>x.p.codigo));
  const grupo = L.featureGroup();
  if(capas.amenazas) S.amenazas.forEach(z=>{
    L.polygon(z.geometria.map(aLatLon), {color:'#c98a00', weight:1.5, dashArray:'6 4', fillColor:'#e6aa32', fillOpacity:.25, interactive:false}).addTo(grupo);
  });
  if(capas.predios) S.predios.filter(p=>vis.has(p.codigo)).forEach(p=>{
    const e = evaluar(p);
    const color = e.prioridad==='ALTA' ? '#d24b45' : e.prioridad==='MEDIA' ? '#d89b18' : '#139b91';
    const act = p.codigo===sel;
    const poly = L.polygon(p.geometria.map(aLatLon), {color:act?'#0f2a44':color, weight:act?3:1.5, fillColor:color, fillOpacity:act?.6:.35, interactive:!DRAW.modo});
    poly.bindTooltip(`<b>${esc(p.codigo)}</b> · ${e.prioridad}<br>${esc(valorVigente(p,'direccion').valor||'Sin dirección')}`, {sticky:true, className:'iacat'});
    poly.on('click', ()=>{ sel = p.codigo; render(); });
    poly.addTo(grupo);
    if(act) poly.bringToFront();
  });
  if(DRAW.modo && DRAW.puntos.length){
    L.polygon(DRAW.puntos.map(aLatLon), {color:'#0f7f76', weight:2, dashArray:'5 3', fillColor:'#14a095', fillOpacity:.25, interactive:false}).addTo(grupo);
    DRAW.puntos.forEach(c=>L.circleMarker(aLatLon(c), {radius:5, color:'#0f7f76', fillColor:'#0f7f76', fillOpacity:1, interactive:false}).addTo(grupo));
  }
  grupo.addTo(LMAP);
  const ajustar = () => { const b = grupo.getBounds(); if(b.isValid()) LMAP.fitBounds(b, {padding:[30,30]}); else LMAP.setView(aLatLon([0,0]), 16); };
  if(LVIEW) LMAP.setView(LVIEW.center, LVIEW.zoom); else ajustar();
  LMAP.on('moveend', ()=>{ LVIEW = {center:LMAP.getCenter(), zoom:LMAP.getZoom()}; });

  setTimeout(()=>{ if(LMAP) LMAP.invalidateSize(); }, 60);
}
function renderMapa(){
  const col = $('colCentro'); if(!col) return;
  if(!S.predios.length && vista!=='agregar'){ col.innerHTML = `<div class="empty"><b>Sin registros disponibles</b>No hay predios cargados en este navegador. Usa el mapa en vivo o importa predios desde Datos.</div>`; return; }
  if(!VB){ VB = limitesTotales(); LVIEW = null; }
  if(usarLeaflet()){ renderMapaLeaflet(); return; }
  if(S.origen && S.origen.geo && typeof L === 'undefined') show('No se cargó el mapa base. Revisa tu conexión a internet y recarga con Ctrl+F5.');
  if(LMAP){ try{ LMAP.remove(); }catch(e){} LMAP = null; }
  const vis = visibles().map(x=>x.p.codigo);
  const tot = S.predios.filter(p=>vis.includes(p.codigo));
  const pts = g => g.map(c=>c.join(',')).join(' ');
  let svg = `<svg viewBox="${VB.x} ${VB.y} ${VB.w} ${VB.h}" preserveAspectRatio="xMidYMid meet"><g transform="scale(1,-1)">`;
  if(capas.amenazas) S.amenazas.forEach(z=>{
    svg += `<polygon points="${pts(z.geometria)}" fill="rgba(230,170,50,.22)" stroke="#c98a00" stroke-width="1.2" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>`;
  });
  if(capas.predios) tot.forEach(p=>{
    const e = evaluar(p);
    const color = e.prioridad==='ALTA' ? '#d24b45' : e.prioridad==='MEDIA' ? '#d89b18' : '#139b91';
    const act = p.codigo===sel;
    svg += `<polygon data-id="${esc(p.codigo)}" points="${pts(p.geometria)}" fill="${color}" fill-opacity="${act?.6:.3}" stroke="${act?'#0f2a44':color}" stroke-width="${act?2.6:1.1}" vector-effect="non-scaling-stroke" style="cursor:pointer"/>`;
  });
  if(DRAW.modo && DRAW.puntos.length){
    svg += `<polygon points="${pts(DRAW.puntos)}" fill="rgba(20,160,149,.25)" stroke="#0f7f76" stroke-width="2" stroke-dasharray="5 3" vector-effect="non-scaling-stroke"/>`;
    DRAW.puntos.forEach(c=>{ svg += `<circle cx="${c[0]}" cy="${c[1]}" r="${Math.max(1.5,VB.w/250)}" fill="#0f7f76"/>`; });
  }
  svg += `</g>`;
  if(capas.predios && VB.w < 700) tot.forEach(p=>{
    const c = centroide(p.geometria);
    svg += `<text x="${c.x}" y="${-c.y}" font-size="${Math.max(3,VB.w/70)}" text-anchor="middle" fill="#14212e" stroke="#fff" stroke-width="${Math.max(.5,VB.w/400)}" paint-order="stroke">${esc(p.codigo)}</text>`;
  });
  svg += `</svg>
    <div class="ctrl"><button id="z-in" title="Acercar">+</button><button id="z-out" title="Alejar">−</button><button id="z-home" title="Ver todo">⌂</button></div>
    <div class="mapa-leg">Arrastra para moverte · rueda o pellizco para acercar · toca un predio</div>`;
  col.innerHTML = svg;
  svgRef = col.querySelector('svg');
  svgRef.addEventListener('click', e=>{ if(!movido && DRAW.modo) agregarPunto(e); });
  $('z-in').onclick = ()=>zoom(0.8);
  $('z-out').onclick = ()=>zoom(1.25);
  $('z-home').onclick = ()=>{ VB = limitesTotales(); aplicarVB(); };
  svgRef.addEventListener('wheel', e=>{ e.preventDefault(); zoom(e.deltaY<0?0.9:1.1); }, {passive:false});
  svgRef.style.touchAction = 'none';
  svgRef.addEventListener('pointerdown', e=>{
    PTRS.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(PTRS.size===1){ drag={x:e.clientX,y:e.clientY,vb:{...VB}}; movido=false; pinch=null; }
    else if(PTRS.size===2){
      const [a,b] = [...PTRS.values()];
      pinch = {d:Math.hypot(a.x-b.x,a.y-b.y)||1, vb:{...VB}, mx:(a.x+b.x)/2, my:(a.y+b.y)/2};
      drag = null; movido = true;
    }
  });
  const tip = $('tip');
  svgRef.querySelectorAll('polygon[data-id]').forEach(el=>{
    el.onclick = e=>{
      if(movido) return;
      if(DRAW.modo){ e.stopPropagation(); agregarPunto(e); return; }
      sel = el.dataset.id; render();
    };
    el.onmousemove = e=>{
      const p = S.predios.find(x=>x.codigo===el.dataset.id); if(!p) return;
      const e2 = evaluar(p);
      tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px';
      tip.innerHTML = `<b>${esc(p.codigo)}</b> · ${e2.prioridad}<br>${esc(valorVigente(p,'direccion').valor||'Sin dirección')}`;
    };
    el.onmouseleave = ()=>{ tip.style.display='none'; };
  });
}
// Arrastre y pellizco con pointer events (ratón, táctil y lápiz)
const PTRS = new Map();
let pinch = null;
window.addEventListener('pointermove', e=>{
  if(!PTRS.has(e.pointerId)) return;
  PTRS.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(!svgRef || !VB) return;
  if(pinch && PTRS.size>=2){
    const [a,b] = [...PTRS.values()];
    const d = Math.hypot(a.x-b.x,a.y-b.y) || 1;
    const k = pinch.d / d;
    const r = svgRef.getBoundingClientRect();
    const fx = (pinch.mx-r.left)/r.width, fy = (pinch.my-r.top)/r.height;
    const wx = pinch.vb.x + fx*pinch.vb.w, wy = pinch.vb.y + fy*pinch.vb.h;
    VB.w = pinch.vb.w*k; VB.h = pinch.vb.h*k;
    VB.x = wx - fx*VB.w; VB.y = wy - fy*VB.h; aplicarVB();
    return;
  }
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>4) movido=true;
  const u = drag.vb.w / svgRef.clientWidth;
  VB.x = drag.vb.x - dx*u; VB.y = drag.vb.y - dy*u; aplicarVB();
});
const soltarPuntero = e=>{
  PTRS.delete(e.pointerId);
  if(PTRS.size<2) pinch = null;
  if(PTRS.size===0) drag = null;
};
window.addEventListener('pointerup', soltarPuntero);
window.addEventListener('pointercancel', soltarPuntero);

  };
  const fotosIA = TMP.fotos.filter(f=>TMP.danos.some(d=>d.fotos.includes(f.id))).slice(0,4);
  const instruccion = `Eres apoyo técnico para inspectores de edificaciones en Ecuador. A partir de los datos y fotos de la visita, describe de forma preliminar: 1) posibles causas de cada daño; 2) un riesgo estimado (bajo, medio o alto) para el predio, con su justificación; 3) qué debe verificar el inspector en campo; 4) recomendaciones de seguimiento. Indica qué no puedes determinar solo con fotos. No es un diagnóstico estructural y no reemplaza la evaluación de un ingeniero. Responde en español, en texto simple, sin tablas.\n\nDatos de la visita:\n${JSON.stringify(contexto, null, 1)}`;
  const content = [
    ...fotosIA.map(f=>({type:'image', source:{type:'base64', media_type:'image/jpeg', data:f.dataUrl.split(',')[1]}})),
    {type:'text', text: instruccion}
  ];
  try{
    const r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:1000, messages:[{role:'user', content}]})});
    const data = await r.json();
    const texto = (data.content||[]).map(i=>i.text||'').join('\n').trim();
    if(!texto) throw new Error('respuesta vacía');
    TMP.analisis = {texto, fecha:hoy(), validado:false};
    pintarAnalisis();
  }catch(e){
    show('No se pudo generar el análisis. Revisa la conexión e intenta de nuevo.');
  }finally{
    btn.disabled = false; btn.textContent = 'Analizar con IA';
  }
}

// ---------- Sistema de coordenadas y diagnóstico de columnas ----------
// UTM (WGS84, hemisferio sur) a latitud y longitud. Verificado con Machala: -79.9595, -3.2610
function utmAGeo(e, n, zona, sur){
  const a=6378137, f=1/298.257223563, k0=0.9996;
  const e2=f*(2-f), ep2=e2/(1-e2);
  const x=e-500000, y=sur? n-10000000 : n;
  const M=y/k0;
  const mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2*e2*e2/256));
  const e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const phi1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
  const N1=a/Math.sqrt(1-e2*Math.sin(phi1)**2);
  const T1=Math.tan(phi1)**2, C1=ep2*Math.cos(phi1)**2;
  const R1=a*(1-e2)/Math.pow(1-e2*Math.sin(phi1)**2,1.5);
  const D=x/(N1*k0);
  const lat=phi1-(N1*Math.tan(phi1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
  const lon0=(zona*6-183)*Math.PI/180;
  const lon=lon0+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/Math.cos(phi1);
  return [lon*180/Math.PI, lat*180/Math.PI];
}
function proyectarAGeo(fc, modo){
  if(modo === 'geo') return fc;
  const pts = (fc.features||[]).flatMap(f=>{
    const g = f.geometry; if(!g) return [];
    if(g.type==='Polygon') return g.coordinates.flat();
    if(g.type==='MultiPolygon') return g.coordinates.flat(2);
    return [];
  });
  const proyectadas = pts.slice(0,500).some(c=>Math.abs(c[0])>180 || Math.abs(c[1])>90);
  if(modo !== 'utm17' && !proyectadas) return fc;
  const conv = c => utmAGeo(c[0], c[1], 17, true);
  fc.features.forEach(f=>{
    const g = f.geometry; if(!g) return;
    if(g.type==='Polygon') g.coordinates = g.coordinates.map(r=>r.map(conv));
    else if(g.type==='MultiPolygon') g.coordinates = g.coordinates.map(pg=>pg.map(r=>r.map(conv)));
  });
  show('Coordenadas proyectadas (UTM 17 sur) convertidas a latitud y longitud.');
  return fc;
}
function avisarColumnas(fc){
  const disponibles = new Set((fc.features||[]).flatMap(f=>Object.keys(f.properties||{})));
  const esenciales = {codigo:'código del predio', uso:'uso de edificación', direccion:'dirección'};
  const faltan = Object.keys(esenciales).filter(k=>!MAPEO[k].some(n=>disponibles.has(n))).map(k=>`${esenciales[k]} (buscado como ${MAPEO[k].join(', ')})`);
  if(faltan.length) show(`Columnas no encontradas en la capa: ${faltan.join('; ')}. Esos campos quedarán sin dato.`);
}

const claveBorrador = codigo => 'iacat-borrador-' + codigo;
function guardarBorrador(p){
  const d = {campos:{}, radios:{}, checks:[], danos:TMP.danos||[], hora:horaAhora()};
  document.querySelectorAll('#colCentro input[type=text],#colCentro input[type=number],#colCentro input[type=date],#colCentro select,#colCentro textarea')

  try{ d = JSON.parse(localStorage.getItem(claveBorrador(p.codigo))); }catch(e){}
  if(!d) return;
  if(d.danos) TMP.danos = d.danos;
  Object.entries(d.campos||{}).forEach(([id,val])=>{ const el=$(id); if(el) el.value = val; });

// =====================================================================
//  v0.6 · CARGA DE SHAPEFILE (ZIP), FUENTES CON VIGENCIA, DOCUMENTOS,
//  AGREGAR PREDIOS/ZONAS A MANO Y SIMULACIÓN DE PRIORIDAD
// =====================================================================
const DRAW = {modo:false, tipo:'predio', puntos:[]};

// Lee el índice del ZIP (directorio central) sin dependencias externas
function listarZip(buf){
  const v = new DataView(buf);
  let eocd = -1;
  for(let i=v.byteLength-22; i>=Math.max(0, v.byteLength-65557); i--){
    if(v.getUint32(i,true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('El archivo no es un ZIP válido.');
  const n = v.getUint16(eocd+10, true);
  let off = v.getUint32(eocd+16, true);
  const dec = new TextDecoder(), nombres = [];
  for(let k=0; k<n; k++){
    if(v.getUint32(off,true) !== 0x02014b50) break;
    const len = v.getUint16(off+28,true), ext = v.getUint16(off+30,true), com = v.getUint16(off+32,true);
    nombres.push(dec.decode(new Uint8Array(buf, off+46, len)).toLowerCase());
    off += 46 + len + ext + com;
  }
  return nombres;
}
async function leerCapa(archivo){
  if(!archivo.name.toLowerCase().endsWith('.zip')) return JSON.parse(await archivo.text());
  const buf = await archivo.arrayBuffer();
  const nombres = listarZip(buf);
  const faltan = ['.shp','.shx','.dbf'].filter(ext=>!nombres.some(n=>n.endsWith(ext)));
  if(faltan.length) throw new Error(`Faltan componentes del Shapefile: ${faltan.join(', ')}. Incluye .shp, .shx y .dbf (y .prj para el sistema de coordenadas).`);
  if(!nombres.some(n=>n.endsWith('.prj'))) show('Aviso: el ZIP no trae .prj; se asume que las coordenadas son geográficas o metros.');
  if(typeof shp === 'undefined') throw new Error('No se cargó la librería de Shapefile. Revisa la conexión a internet e intenta de nuevo.');
  const geo = await shp(buf);
  const colecciones = Array.isArray(geo) ? geo : [geo];
  return {type:'FeatureCollection', features: colecciones.flatMap(c=>c.features||[])};
}

// Vigencia: vigente / por vencer (80% del plazo) / desactualizada
function vigenciaFuente(f){
  if(!f.fecha_actualizacion) return {t:'Sin fecha', c:'SIN'};
  const dias = (Date.now() - new Date(f.fecha_actualizacion+'T00:00:00'))/86400000;
  const max = S.reglas.vigenciaDias || 365;
  if(dias > max) return {t:'Desactualizada', c:'ALTA'};
  if(dias > max*0.8) return {t:'Por vencer', c:'MEDIA'};
  return {t:'Vigente', c:'BAJA'};
}
const vigenciaHTML = f => { const x = vigenciaFuente(f); return `<span class="tag ${x.c}">${x.t}</span>`; };

// Simulación: qué cambiaría la prioridad si se completan las acciones posibles
function accionPara(t){
  if(/Intersecta/i.test(t)) return 'No depende de visitas: requiere revisar la capa de amenaza';
  if(/Sin inspección/i.test(t)) return 'Registrar una visita de verificación';
  if(/pendiente/i.test(t)) return 'Aprobar o rechazar la propuesta pendiente';
  if(/malo/i.test(t)) return 'Nueva visita que confirme o descarte el estado';
  if(/discrepancia/i.test(t)) return 'Corregir la discrepancia con una inspección';
  if(/uso/i.test(t)) return 'Confirmar el uso en campo o con un documento';
  if(/dirección/i.test(t)) return 'Confirmar la dirección en campo o con un documento';
  if(/área/i.test(t)) return 'Revisar el área registrada frente a la geometría';
  if(/construcción/i.test(t)) return 'Registrar pisos, material y tipo en una visita';
  return 'Revisar en campo';
}
function bloqueSimulacion(p){
  const e = evaluar(p);
  const malo = !!(e.ult && e.ult.valores && e.ult.valores.estado_conservacion==='Malo' && S.reglas.maloEsAlta);
  const filas = [
    ...e.motivos.map(t=>({t, a:accionPara(t), fija:/Intersecta|malo|discrepancia/i.test(t)})),
    ...e.brechas.map(t=>({t, a:accionPara(t), fija:false}))
  ];
  const quedan = filas.filter(f=>f.fija).length;
  const hipotetica = (e.zonas.length || malo) ? 'ALTA' : (quedan ? 'MEDIA' : 'BAJA');
  return `
    <div class="lab">¿Qué cambiaría la prioridad?</div>
    <div class="resumen">Prioridad actual: <b>${e.prioridad}</b>. Si se completan las acciones que dependen de visitas y documentos, quedaría en <b>${hipotetica}</b>. Es una simulación: no cambia ningún dato.</div>
    ${filas.length ? tabla(['Factor','Cómo se resuelve','Efecto'],
        filas.map(f=>[esc(f.t), esc(f.a), f.fija ? '<span class="tag ALTA">no depende de visitas</span>' : '<span class="tag BAJA">se resuelve</span>']))
      : '<p class="muted">Ningún factor pendiente.</p>'}`;
}

function agregarPunto(e){
  if(!svgRef) return;
  const pt = svgRef.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const q = pt.matrixTransform(svgRef.getScreenCTM().inverse());
  DRAW.puntos.push([+q.x.toFixed(2), +(-q.y).toFixed(2)]);
  renderMapa(); actualizarEstadoDraw();
}
function guardarDibujo(){
  const n = DRAW.puntos.length;
  if(n < 3){ show('Marca al menos 3 vértices'); return; }
  if(DRAW.tipo === 'predio'){
    const cod = $('a-cod').value.trim();
    if(!cod){ show('Indica el código catastral'); return; }
    if(S.predios.some(p=>p.codigo===cod)){ show('Ya existe un predio con ese código'); return; }
    const area = parseFloat($('a-area').value);
    S.predios.push({
      codigo: cod, fid: null, origen: 'manual', registrado_por: USUARIO.nombre,
      geometria: DRAW.puntos.slice(),
      fuente: {uso: $('a-uso').value || null, direccion: $('a-dir').value.trim() || null, linderos:{}, frentes:{},
               area_fuente: isNaN(area) ? null : area, perimetro_fuente: null, documento: $('a-doc').value.trim() || null}
    });
    registrar('agregó predio manual', cod, `${n} vértices`);
    sel = cod;
  } else {
    const nom = $('a-nom').value.trim();
    if(!nom){ show('Indica el nombre de la amenaza'); return; }
    S.amenazas.push({id:'A'+(S.amenazas.length+1), nombre:nom, tipo:'amenaza',
      fuente: $('a-fue').value.trim() || 'Registro manual', fecha: hoy(), geometria: DRAW.puntos.slice()});

}

async function guardarInspeccion(p){
  const fecha = $('f-fecha').value, tec = $('f-tec').value.trim();
  if(!fecha){ show('Indica la fecha de la visita'); return; }
  if(!tec){ show('Indica el técnico responsable'); return; }
  if(TMP.danos.some(d=>!d.tipo || !d.severidad)){ show('Completa tipo y severidad de cada daño registrado'); return; }
  const iaTxt = $('f-ia-txt'); if(TMP.analisis && iaTxt) TMP.analisis.texto = iaTxt.value;
  const analisisValido = !!(TMP.analisis && $('f-ia-val') && $('f-ia-val').checked);
  const r = validarTMP(p, TMP);
  if(r.bloq.length){ mostrarValidacion(p); show(r.bloq[0]); return; }
  const verif = n => (document.querySelector(`input[name="${n}"]:checked`)||{}).value || null;
  const ins = {
    id:'INS-'+Date.now(), codigo:p.codigo, fecha, tecnico:tec, inspector_id:USUARIO.id, gps:TMP.gps,
    verificaciones:{uso:verif('ver-uso'), direccion:verif('ver-dir')},
    valores:{
      uso:$('v-uso').value.trim()||null, direccion:$('v-dir').value.trim()||null,
      pisos: $('v-pisos').value==='' ? null : Number($('v-pisos').value),
      material:$('v-mat').value||null, tipo_construccion:$('v-tipo').value||null, estado_conservacion:$('v-estado').value||null, anio_construccion:$('v-anio').value ? Number($('v-anio').value) : null, estructura:$('v-estr').value||null
    },
    discrepancias:$('f-disc').value.trim(), observaciones:$('f-obs').value.trim(),
    fotos: TMP.fotos.map(f=>({id:f.id, categoria:f.categoria, nombre:f.nombre, hash:f.hash, calidad:f.calidad})),
    dist_m: r.dist, alerta_ubicacion: !!(r.dist!=null && r.dist > S.reglas.umbralGPS),
    observaciones_calidad: r.avis,
    checklist: [...document.querySelectorAll('input[name=chk]:checked')].map(x=>x.value),
    danos: TMP.danos.map(d=>({...d, fotos:d.fotos.filter(id=>TMP.fotos.some(f=>f.id===id))})),
    analisis_ia: analisisValido ? {texto:TMP.analisis.texto, fecha:TMP.analisis.fecha, validado:true} : null,
    estado:'enviada'
  };
  try{ for(const f of TMP.fotos) await DB.guardar({...f, codigo:p.codigo, fecha}); }
  catch(err){ show('No se pudieron guardar las fotos en este navegador'); return; }
  S.inspecciones[p.codigo] = S.inspecciones[p.codigo] || [];
  S.inspecciones[p.codigo].push(ins);
  const n = proponer(ins);
  notificar({tipo:'inspeccion', titulo:`Inspección enviada: ${p.codigo}`,
    cuerpo:`${tec} · ${fecha} · ${n} propuesta(s) de actualización · ${ins.danos.length} daño(s) · ${ins.fotos.length} foto(s)${r.avis.length?` · ${r.avis.length} observación(es)`:''}.`,
    codigo:p.codigo, roles:['supervisor']});
  if(ins.alerta_ubicacion) notificar({tipo:'ubicacion', titulo:`Ubicación lejana en ${p.codigo}`,
    cuerpo:`La visita quedó a ${r.dist} m del predio (umbral ${S.reglas.umbralGPS} m). Revisar.`, codigo:p.codigo, roles:['supervisor']});
  registrar('envió inspección', p.codigo, `${n} propuesta(s), ${ins.fotos.length} foto(s)`);
  TMP = {codigo:null, gps:null, fotos:[], danos:[], analisis:null};
  localStorage.removeItem('iacat-borrador-'+p.codigo);
  guardar();
  show(`Inspección enviada. ${n} propuesta(s) pasan a supervisión.`);
  render();
}

        <div style="margin:6px 0"><span class="muted">Antes:</span> ${v(a.anterior)} &nbsp;→&nbsp; <b>${esc(a.propuesto)}</b></div>
        ${a.estado!=='pendiente' ? `<div class="muted">Decidido por ${esc(a.decidido_por)} el ${a.fecha_decision}${a.motivo?` · Motivo: ${esc(a.motivo)}`:''}</div>` : ''}
        ${a.estado==='pendiente' ? `<div class="acc-row">
          ${puede('aprobar') ? `<button class="btn ok mini" data-ok="${esc(a.id)}">Aprobar</button><button class="btn no mini" data-no="${esc(a.id)}">Rechazar</button>` : '<span class="muted">Pendiente de decisión del supervisor</span>'}
          <button class="btn sec mini" data-ver="${esc(a.codigo)}">Ver predio</button></div>` : ''}
      </div>`).join('') || '<div class="empty"><b>Nada en este estado</b>Cuando llegue una inspección aparecerán aquí sus propuestas.</div>'}`;
  col.querySelectorAll('[data-a]').forEach(c=>c.onclick=()=>{ FILTRO_ACT=c.dataset.a; render(); });

  col.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>{ sel=b.dataset.ver; vista='bandeja'; render(); });
}

// =====================================================================

function renderMensajes(){
  const col = $('colCentro');
  if(!MENSAJE.predio) MENSAJE.predio = sel;
  const p = S.predios.find(x=>x.codigo===MENSAJE.predio) || S.predios[0];
  if(!p){ col.innerHTML = '<div class="empty"><b>No hay predios para redactar</b>Carga o restaura los datos primero.</div>'; return; }
  if(!MENSAJE.texto || MENSAJE.regen){ MENSAJE.texto = PLANTILLAS[MENSAJE.plantilla].cuerpo(p); MENSAJE.regen = false; }
  col.innerHTML = `
    <div class="cab-card"><div><h1>Asistente de mensajes</h1><div class="muted">Redacta avisos y resúmenes a partir de los datos del predio. Cada dato lleva su origen entre corchetes. Es redacción por plantilla: no inventa datos y puedes editar el texto.</div></div></div>
    <div class="grid2">
      <div>
        <label class="campo">Predio<select id="m-pred">${S.predios.map(x=>`<option value="${esc(x.codigo)}" ${p && x.codigo===p.codigo?'selected':''}>${esc(x.codigo)}</option>`).join('')}</select></label>
        <label class="campo">Plantilla<select id="m-plan">${Object.entries(PLANTILLAS).map(([k,pl])=>`<option value="${k}" ${MENSAJE.plantilla===k?'selected':''}>${pl.t}</option>`).join('')}</select></label>
        <button class="btn sec" id="m-regen">Regenerar desde los datos</button>
        <div class="nota">Los corchetes indican el origen: [FUENTE], [VALIDADO], [CALCULADO] o [SIN DATO]. Revisa el texto antes de enviarlo.</div>
      </div>
      <div>
        <textarea id="m-texto" style="min-height:300px">${esc(MENSAJE.texto)}</textarea>
        <div class="acc-row" style="margin-top:8px">
          <button class="btn sec" id="m-copiar">Copiar</button>
          <button class="btn" id="m-enviar">Enviar como notificación interna</button>
        </div>
        <div class="muted" style="margin-top:6px">Destino: ${esc((PLANTILLAS[MENSAJE.plantilla].para==='inspector' && p && S.asignaciones[p.codigo]) ? S.asignaciones[p.codigo].nombre : PLANTILLAS[MENSAJE.plantilla].para)}</div>
      </div>
    </div>`;
  $('m-pred').onchange = e=>{ MENSAJE.predio = e.target.value; MENSAJE.texto=''; render(); };
  $('m-plan').onchange = e=>{ MENSAJE.plantilla = e.target.value; MENSAJE.texto=''; render(); };
  $('m-regen').onclick = ()=>{ MENSAJE.texto=''; render(); };
  $('m-texto').oninput = e=>{ MENSAJE.texto = e.target.value; };
  $('m-copiar').onclick = async ()=>{
    try{ await navigator.clipboard.writeText($('m-texto').value); show('Texto copiado'); }
    catch(err){ $('m-texto').select(); document.execCommand('copy'); show('Texto copiado'); }
  };
  $('m-enviar').onclick = ()=>{
    const pl = PLANTILLAS[MENSAJE.plantilla];
    const a = S.asignaciones[p.codigo];
    const usuarios = pl.para==='inspector' && a ? [a.inspector] : [];
    const roles = pl.para==='inspector' && !a ? ['inspector'] : pl.para==='supervisor' ? ['supervisor'] : [];
    if(pl.para==='ciudadano'){ show('Las respuestas ciudadanas se entregan fuera de la plataforma'); return; }
    notificar({tipo:'sistema', titulo:`Mensaje: ${pl.t} · ${p.codigo}`, cuerpo: $('m-texto').value.slice(0,400), codigo:p.codigo, roles, usuarios});
    registrar('envió mensaje', p.codigo, pl.t);
    guardar(); show('Mensaje enviado a notificaciones');
  };
}

// =====================================================================
//  PANEL Y ANÁLISIS
// =====================================================================
function renderPanel(){
  const col = $('colCentro');
  const ev = S.predios.map(p=>({p,e:evaluar(p)}));
  const n = ev.length || 1;
  const cnt = {ALTA:0,MEDIA:0,BAJA:0}; ev.forEach(x=>cnt[x.e.prioridad]++);
  const conBrecha = ev.filter(x=>x.e.brechas.length).length;
  const sinInsp = ev.filter(x=>!vigente(x.p.codigo)).length;
  const pend = S.actualizaciones.filter(a=>a.estado==='pendiente').length;
  const todasIns = Object.values(S.inspecciones).flat();
  const fotos = todasIns.flatMap(r=>r.fotos||[]);
  const fotosAviso = fotos.filter(f=>f.calidad && f.calidad.avisos.length).length;
  const discr = todasIns.filter(r=>r.discrepancias).length;
  const asignados = Object.keys(S.asignaciones).length;
  // Tendencia de inspecciones: últimos 12 meses
  const meses = [];
  for(let i=11;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); meses.push({k:d.toISOString().slice(0,7), t:d.toLocaleDateString('es-EC',{month:'short'})}); }
  const porMes = meses.map(mm=>({...mm, c: todasIns.filter(r=>r.fecha.slice(0,7)===mm.k).length}));
  const maxM = Math.max(1, ...porMes.map(x=>x.c));
  // Zonas
  const zonas = {};
  ev.forEach(({p,e})=>{ const z=zonaDe(p.codigo); zonas[z]=zonas[z]||{n:0,alta:0,ins:0,disc:0}; zonas[z].n++; if(e.prioridad==='ALTA') zonas[z].alta++; });
  todasIns.forEach(r=>{ const z=zonaDe(r.codigo); zonas[z]=zonas[z]||{n:0,alta:0,ins:0,disc:0}; zonas[z].ins++; if(r.discrepancias) zonas[z].disc++; });
  const filasZona = Object.entries(zonas).sort((a,b)=>b[1].alta-a[1].alta).slice(0,12).map(([z,d])=>[
    `<b>${esc(z)}</b>`, d.n, d.alta, d.ins, d.disc ? `${d.disc} (${Math.round(d.disc/Math.max(1,d.ins)*100)}%)` : '0'
  ]);
  col.innerHTML = `
    <div class="cab-card"><div><h1>Panel y análisis</h1><div class="muted">Indicadores calculados con las reglas vigentes. El análisis de fotos es un control de calidad sencillo; no reconoce contenido.</div></div></div>
    <div class="kpis">
      <div class="kpi" style="--c:var(--navy)"><b>${S.predios.length}</b><span>Predios</span></div>
      <div class="kpi" style="--c:var(--red)"><b>${cnt.ALTA}</b><span>Prioridad alta</span></div>
      <div class="kpi" style="--c:var(--amber)"><b>${conBrecha}</b><span>Con brechas de información</span></div>
      <div class="kpi" style="--c:var(--amber)"><b>${sinInsp}</b><span>Sin inspección vigente</span></div>
      <div class="kpi" style="--c:var(--blue)"><b>${pend}</b><span>Actualizaciones pendientes</span></div>
      <div class="kpi" style="--c:var(--teal)"><b>${asignados}</b><span>Visitas asignadas</span></div>
      <div class="kpi" style="--c:var(--teal)"><b>${todasIns.length}</b><span>Inspecciones registradas</span></div>
      <div class="kpi" style="--c:var(--amber)"><b>${fotosAviso}</b><span>Fotos con aviso de calidad (de ${fotos.length})</span></div>
    </div>
    <div class="grid2" style="grid-template-columns:1fr 1fr">
      <div class="card"><h3 style="margin-top:0">Inspecciones por mes (12 meses)</h3>
        <div class="bars">${porMes.map(x=>`<div><b>${x.c||''}</b><i style="height:${Math.round(x.c/maxM*100)}%"></i><span>${x.t}</span></div>`).join('')}</div></div>
      <div class="card"><h3 style="margin-top:0">Distribución por prioridad</h3>
        ${[['ALTA','#d24b45'],['MEDIA','#d89b18'],['BAJA','#139b91']].map(([k,c])=>`<div class="muted">${k}: ${cnt[k]} (${(n ? Math.round(cnt[k]/n*100) : 0)}%)</div><div class="barra"><i style="width:${(n ? Math.round(cnt[k]/n*100) : 0)}%;background:${c}"></i></div>`).join('')}
        <h3>Datos que faltan (predios sin valor vigente)</h3>
        ${tabla(['Campo','Predios sin dato','%'], CAMPOS.map(c=>{ const k=ev.filter(x=>valorVigente(x.p,c).valor==null).length; return [ETIQ[c], k, (n ? Math.round(k/n*100) : 0)+'%']; }))}
      </div>
    </div>
    <h3>Zonas (código catastral, primeros dos tramos)</h3>
    ${tabla(['Zona','Predios','Alta','Inspecciones','Con discrepancia'], filasZona)}
    <div class="resumen">Discrepancias registradas en inspecciones: <b>${discr}</b> de ${todasIns.length}. Las zonas se agrupan por los dos primeros tramos del código; cuando tengas la clasificación oficial de sectores, la reemplazamos.</div>`;
}
